<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172c40;background:#f2f5f8;line-height:1.42}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}

header{background:#003c82;color:#fff;padding:13px max(14px,calc((100vw - 1220px)/2));border-bottom:3px solid #087e8b}

.layout{max-width:1220px;margin:14px auto 28px;display:grid;grid-template-columns:188px minmax(0,1fr);gap:12px;padding:0 12px}
aside{align-self:start;position:sticky;top:12px;border:1px solid #d8e2eb;border-radius:10px;background:white;padding:12px}

.nav span{font-size:.76rem;border:1px solid #b9cad9;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;flex-shrink:0}
.nav .active{background:#e8f1f8;color:#003c82;font-weight:700}
main{min-width:0}.paper{background:white;border:1px solid #d8e2eb;border-radius:10px;padding:17px 22px 20px;min-height:375px}
.section-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.step-count{color:#087e8b;font-size:.76rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.32rem;line-height:1.2;margin:5px 0 9px}p{margin:8px 0}.muted{color:#475c70;font-size:.89rem}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}p code,li code{background:#eaf0f5;color:#142638;border-radius:3px;padding:1px 4px}
.task-list{margin:9px 0 0;padding:0;list-style:none;counter-reset:task;display:grid;gap:5px}.task{counter-increment:task;display:grid;grid-template-columns:minmax(170px,.87fr) minmax(0,1.5fr);align-items:start;gap:12px;padding:8px 10px;border:1px solid #e0e8ef;border-radius:7px;background:#fcfdff}
.task-label{display:flex;align-items:flex-start;gap:8px;font-size:.9rem;font-weight:590;line-height:1.35;padding-top:5px}.task-label::before{content:counter(task) ".";color:#087e8b;font-weight:800;flex-shrink:0;min-width:21px}
.task pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf1f7;color:#0d283e!important;padding:8px 11px;border:1px solid #cbdce9;border-radius:5px;font-size:.9rem;line-height:1.37;tab-size:2;user-select:text}
.task pre code{color:#0d283e!important;background:transparent!important;font-size:inherit!important;white-space:inherit}
.task .detail{grid-column:2;font-size:.79rem;color:#42596c;margin-top:-5px}.task.text-only .detail{grid-column:2;margin-top:2px}
.hint{font-size:.86rem;color:#425568;border-left:3px solid #087e8b;background:#f2f8fa;padding:8px 11px;margin-top:12px}
.progress{height:4px;display:flex;gap:4px;margin-bottom:13px}.progress i{border-radius:5px;background:#e0e8ef;flex:1}.progress .current{background:#087e8b}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #e6edf2;margin-top:16px;padding-top:14px}
.btn{font-size:.88rem;font-weight:700;padding:8px 15px;border-radius:6px;border:1px solid #c2d2df;color:#003c82;background:white}.btn.primary{background:#003c82;border-color:#003c82;color:white}.btn.teal{background:#087e8b;border-color:#087e8b;color:white}
.starter-files{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}.starter-files button{border:1px solid #abc1d2;background:#eaf4f8;color:#003c82;border-radius:6px;font-size:.8rem;padding:5px 9px}
.question{margin:7px 0;padding:10px 12px 11px;border:1px solid #dde7ef;border-radius:7px;min-width:0}.question legend{font-weight:680;font-size:.93rem;padding:0 4px}
.answer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.answer label{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid #dce5ec;border-radius:5px;font-size:.85rem;cursor:pointer;line-height:1.3}
.answer label:has(input:checked){border-color:#087e8b;background:#ecf8f7}.answer input{flex-shrink:0;accent-color:#087e8b;margin-top:3px}
.details{font-size:.84rem;color:#495c6a}.album{margin:12px 0}.album input{max-width:160px;border:1px solid #c1d0db;border-radius:5px;padding:6px}
.kpis{display:flex;gap:9px;margin:11px 0}.kpi{border:1px solid #cddde6;border-radius:7px;padding:10px 15px;background:#f4f9fb}.kpi strong{display:block;font-size:1.35rem;color:#003c82}
.result-item{margin:7px 0;padding:10px 12px;border:1px solid #dde6ed;border-left:4px solid #b45539;border-radius:5px;font-size:.87rem}.result-item.good{border-left-color:#178055}.result-item p{margin:3px 0}
footer{max-width:1220px;margin:0 auto 24px;padding:0 15px;color:#687a88;font-size:.77rem;text-align:right}
@media(max-width:880px){.layout{grid-template-columns:1fr}.nav{display:flex;flex-wrap:wrap}.nav button{flex:1;min-width:95px;justify-content:center}.nav span{display:none}aside{position:static}}
@media(max-width:650px){header{padding:12px}.paper{padding:13px}.task{grid-template-columns:1fr;gap:5px;padding:9px}.task .detail{grid-column:1;margin-top:0}.task-label{padding-top:0}.answer{grid-template-columns:1fr}}
@media print{body{background:white}header{background:white;color:black;border-bottom:1px solid #ccc}.layout{display:block;margin:0}aside,.actions,.progress{display:none!important}.paper{border:0;padding:0}.task{break-inside:avoid}}
</style>

<script>
"use strict";
const CONFIG={"id":"NDP-04","number":"04","title":"Tworzenie dokumentów LaTeX","steps":[{"name":"Start","heading":"Przygotuj dokument","intro":"Zapisz plik startowy <code>wprowadzenie.tex</code> w katalogu <code>~/cw4</code>. Fragmenty LaTeX wstawiaj do odpowiednich sekcji pliku, a polecenia terminalowe wykonuj w terminalu","items":[{"label":"Utwórz katalog roboczy","code":"mkdir -p ~/cw4","detail":null,"kind":"code"},{"label":"Pobierz plik startowy i zapisz go w katalogu cw4","code":null,"detail":null,"kind":"starter"},{"label":"Otwórz plik w Visual Studio Code","code":null,"detail":"Sprawdź klasę book, rozmiar 12pt, tryb twoside, autora, tytuł, części, rozdziały i podrozdziały","kind":"text"},{"label":"Przejdź do katalogu roboczego","code":"cd ~/cw4","detail":null,"kind":"code"},{"label":"Skompiluj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Otwórz wprowadzenie.pdf","code":null,"detail":"Sprawdź stronę tytułową, układ dwustronny i polskie znaki","kind":"text"}],"tail":"Do pracy wystarczy lokalny edytor i instalacja LaTeX z pakietami <code>babel</code> oraz <code>lipsum</code>."},{"name":"Pismo","heading":"Formatuj krój i wielkość tekstu","intro":"Poniższe fragmenty wstawiaj kolejno do sekcji <code>Krój pisma</code>, każdy jako osobny akapit","items":[{"label":"Wstaw tekst pogrubiony","code":"\\textbf{Pogrubiony tekst}","detail":null,"kind":"code"},{"label":"Wstaw pismo pochylone","code":"\\textsl{Pochylony tekst}","detail":null,"kind":"code"},{"label":"Wstaw kursywę.","code":"\\textit{Tekst zapisany kursywą}","detail":null,"kind":"code"},{"label":"Podkreśl fragment","code":"\\underline{Podkreślony tekst}","detail":null,"kind":"code"},{"label":"Zastosuj zapis maszynowy","code":"\\verb!int main()!","detail":null,"kind":"code"},{"label":"Powiększ wybrany fragment","code":"{\\Large Większy tekst}","detail":null,"kind":"code"},{"label":"Pomniejsz inny fragment.","code":"{\\small Mniejszy tekst}","detail":null,"kind":"code"},{"label":"Zbuduj dokument po zmianach","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Pismo pochylone (<code>textsl</code>) i kursywa (<code>textit</code>) to różne odmiany kroju."},{"name":"Listy","heading":"Zbuduj wyliczenie i wypunktowanie","intro":"Fragmenty wstawiaj w sekcji <code>Środowiska</code>. Nie umieszczaj dwóch poleceń terminalowych w jednej ramce.","items":[{"label":"Rozpocznij listę numerowaną","code":"\\begin{enumerate}","detail":null,"kind":"code"},{"label":"Dodaj pierwszy element.","code":"\\item Pierwsza czynność","detail":null,"kind":"code"},{"label":"Dodaj drugi element.","code":"\\item Druga czynność","detail":null,"kind":"code"},{"label":"Zakończ wyliczenie","code":"\\end{enumerate}","detail":null,"kind":"code"},{"label":"Rozpocznij wypunktowanie.","code":"\\begin{itemize}","detail":null,"kind":"code"},{"label":"Dodaj element pierwszy","code":"\\item Materiał źródłowy","detail":null,"kind":"code"},{"label":"Dodaj element drugi","code":"\\item Dokument wynikowy","detail":null,"kind":"code"},{"label":"Zakończ wypunktowanie","code":"\\end{itemize}","detail":null,"kind":"code"}],"tail":null},{"name":"Grafika","heading":"Wstaw rysunek i tabelę","intro":"Kontynuuj pracę w sekcji <code>Środowiska</code>. Przykładowy rysunek nie wymaga pobierania pliku graficznego.","items":[{"label":"Rozpocznij środowisko figure","code":"\\begin{figure}[htbp]","detail":null,"kind":"code"},{"label":"Wycentruj rysunek","code":"\\centering","detail":null,"kind":"code"},{"label":"Wstaw tymczasową grafikę","code":"\\fbox{\\rule{0pt}{14mm}\\rule{36mm}{0pt}}","detail":null,"kind":"code"},{"label":"Dodaj podpis.","code":"\\caption{Przykładowy rysunek}","detail":null,"kind":"code"},{"label":"Dodaj etykietę rysunku","code":"\\label{fig:przyklad}","detail":null,"kind":"code"},{"label":"Zakończ figure","code":"\\end{figure}","detail":null,"kind":"code"},{"label":"Rozpocznij tabelę","code":"\\begin{table}[htbp]","detail":null,"kind":"code"},{"label":"Wstaw podpis NAD tabelą","code":"\\caption{Wyniki pomiarów}","detail":null,"kind":"code"},{"label":"Ustaw etykietę tabeli","code":"\\label{tab:pomiary}","detail":null,"kind":"code"},{"label":"Wycentruj tabelę.","code":"\\centering","detail":null,"kind":"code"},{"label":"Zadeklaruj trzy kolumny","code":"\\begin{tabular}{|c|c|c|}\\hline","detail":null,"kind":"code"},{"label":"Dodaj nagłówek","code":"Pomiar & A & B \\\\ \\hline","detail":null,"kind":"code"},{"label":"Dodaj wiersz pierwszy","code":"1 & 10 & 20 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz drugi","code":"2 & 11 & 21 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz trzeci","code":"3 & 12 & 22 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz czwarty","code":"4 & 13 & 23 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz piąty","code":"5 & 14 & 24 \\\\ \\hline","detail":null,"kind":"code"},{"label":"Zakończ tabular.","code":"\\end{tabular}","detail":null,"kind":"code"},{"label":"Zakończ table.","code":"\\end{table}","detail":null,"kind":"code"},{"label":"Przekompiluj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Tabela zawiera trzy kolumny, pięć wierszy danych i osobny wiersz nagłówkowy. Numer i podpis umieszcza się w otoczeniu <code>table</code>."},{"name":"Wzory","heading":"Wprowadź wzory matematyczne","intro":"Zamieść trzy niezależne środowiska <code>equation</code> w sekcji <code>Wzory matematyczne</code>. Każdy fragment jest kompletnym równaniem.","items":[{"label":"Zapisz wzór na pole koła","code":"\\begin{equation}\\label{eq:pole}\nS = \\pi r^{2}\n\\end{equation}","detail":null,"kind":"code"},{"label":"Zdefiniuj wyróżnik trójmianu","code":"\\begin{equation}\\label{eq:delta}\n\\Delta = b^{2} - 4ac\n\\end{equation}","detail":null,"kind":"code"},{"label":"Zapisz pierwsze miejsce zerowe","code":"\\begin{equation}\\label{eq:x1}\nx_1 = \\frac{-b - \\sqrt{\\Delta}}{2a}\n\\end{equation}","detail":null,"kind":"code"},{"label":"Zapisz drugie miejsce zerowe","code":"\\begin{equation}\\label{eq:x2}\nx_2 = \\frac{-b + \\sqrt{\\Delta}}{2a}\n\\end{equation}","detail":null,"kind":"code"},{"label":"Skompiluj cztery równania","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Ułamki i pierwiastki zapisuj poleceniami <code>\\frac</code> oraz <code>\\sqrt</code>; indeks dolny przez <code>_</code>."},{"name":"Odwołania","heading":"Odwołania i przypisy","intro":"Dodaj w sekcji <code>Odwołania</code> zdania zawierające odwołania do wcześniejszych etykiet","items":[{"label":"Odwołaj się do rysunku","code":"Rysunek~\\ref{fig:przyklad} prezentuje przykład","detail":null,"kind":"code"},{"label":"Odwołaj się do tabeli","code":"Wyniki umieszczono w tabeli~\\ref{tab:pomiary}","detail":null,"kind":"code"},{"label":"Odwołaj się do wzoru","code":"Pole koła oblicza wzór~(\\ref{eq:pole})","detail":null,"kind":"code"},{"label":"Wstaw przypis dolny","code":"Jest to przypis\\footnote{Tekst przypisu na dole strony}","detail":null,"kind":"code"},{"label":"Uruchom pierwszą kompilację","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Ponów kompilację dla odwołań","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Po pierwszym przebiegu odwołania mogą wyświetlać znaki zapytania. Kolejny przebieg odczytuje plik <code>.aux</code>."},{"name":"Znaki","heading":"Znaki specjalne i spisy","intro":"Zapisz znaki specjalne w sekcji <code>Znaki specjalne</code>, a spisy dodaj bezpośrednio po <code>\\maketitle</code>.","items":[{"label":"Wstaw znaki $, #, %, ^, &.","code":"\\$ \\# \\% \\^{} \\&","detail":null,"kind":"code"},{"label":"Wstaw cudzysłów oraz nawiasy kwadratowe.","code":"\\textquotedbl{} [ ]","detail":null,"kind":"code"},{"label":"Wstaw ukośnik odwrotny i tyldę.","code":"\\textbackslash{} \\textasciitilde{}","detail":null,"kind":"code"},{"label":"Wstaw nawiasy klamrowe.","code":"\\{ \\}","detail":null,"kind":"code"},{"label":"Wstaw kreskę pionową, podkreślenie i @.","code":"\\textbar{} \\_ @","detail":null,"kind":"code"},{"label":"Wstaw spis treści po stronie tytułowej.","code":"\\tableofcontents","detail":null,"kind":"code"},{"label":"Dodaj spis rysunków.","code":"\\listoffigures","detail":null,"kind":"code"},{"label":"Dodaj spis tabel.","code":"\\listoftables","detail":null,"kind":"code"},{"label":"Skompiluj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Ponów kompilację dla spisów","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Spisy i numeracja aktualizują się po kolejnych przebiegach LaTeX"},{"name":"Dodatkowe","heading":"Zadania dodatkowe: grafy TikZ","intro":"Dodaj pakiet w preambule, a następne fragmenty umieść w sekcji <code>Rysunki w PGF/TikZ</code>. Po utworzeniu grafu podstawowego odtwórz wzór rozszerzony","items":[{"label":"Dodaj pakiet w preambule","code":"\\usepackage{tikz}","detail":null,"kind":"code"},{"label":"Rozpocznij figure","code":"\\begin{figure}[htbp]","detail":null,"kind":"code"},{"label":"Wycentruj graf","code":"\\centering","detail":null,"kind":"code"},{"label":"Rozpocznij środowisko grafu","code":"\\begin{tikzpicture}[every node/.style={draw,circle,minimum size=7mm}]","detail":null,"kind":"code"},{"label":"Dodaj węzeł a.","code":"\\node (a) at (0,0) {a};","detail":null,"kind":"code"},{"label":"Dodaj węzeł b.","code":"\\node (b) at (1.2,-0.7) {b};","detail":null,"kind":"code"},{"label":"Dodaj węzeł c.","code":"\\node (c) at (1.2,0.7) {c};","detail":null,"kind":"code"},{"label":"Wstaw połączenie a → b.","code":"\\draw[->] (a) -- (b);","detail":null,"kind":"code"},{"label":"Wstaw zielone połączenie a → c.","code":"\\draw[->,green!60!black] (a) -- (c);","detail":null,"kind":"code"},{"label":"Dodaj przerywaną niebieską strzałkę.","code":"\\draw[->,dashed,blue] (c) -- ++(1,0);","detail":null,"kind":"code"},{"label":"Zakończ tikzpicture.","code":"\\end{tikzpicture}","detail":null,"kind":"code"},{"label":"Dodaj podpis.","code":"\\caption{Początkowy graf}","detail":null,"kind":"code"},{"label":"Zakończ figure.","code":"\\end{figure}","detail":null,"kind":"code"},{"label":"Rozbuduj graf do wzoru końcowego.","code":null,"detail":"W tym samym rysunku dodaj węzły Δ oraz z, dodatkowe krawędzie, kierunki i style z podglądu poniżej.","kind":"text"},{"label":"Zaprojektuj drugi graf według wzoru prowadzącego.","code":null,"detail":"Zadbaj o etykiety, kierunki i rodzaje krawędzi; zapisz wynik do PDF.","kind":"text"}],"tail":"<details class=\"graph-ref\"><summary>Otwórz wzór grafu do samodzielnego odtworzenia</summary>\n<svg role=\"img\" aria-label=\"Graf: węzły a, b, c, Delta oraz z; strzałki i połączenia w kilku stylach\" width=\"410\" height=\"150\" viewBox=\"0 0 410 150\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><marker id=\"gr4arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10Z\" fill=\"context-stroke\"/></marker></defs>\n<g fill=\"none\" stroke=\"#37495a\" stroke-width=\"1.6\" marker-end=\"url(#gr4arr)\"><path d=\"M83 89 L120 116\"/><path d=\"M147 38 L240 74\"/><path d=\"M145 123 L240 91\"/></g>\n<g stroke=\"#13874a\" stroke-width=\"2.2\" marker-end=\"url(#gr4arr)\"><path d=\"M83 73 L130 38\"/></g>\n<g stroke=\"#2460ac\" stroke-width=\"2\" stroke-dasharray=\"5 4\" marker-end=\"url(#gr4arr)\"><path d=\"M148 29 L196 29\"/></g>\n<path d=\"M83 80 L240 82\" stroke=\"#929ba5\" stroke-dasharray=\"2 3\" fill=\"none\" marker-end=\"url(#gr4arr)\"/>\n<g stroke=\"#cc3d3d\" stroke-width=\"2\" marker-end=\"url(#gr4arr)\"><path d=\"M329 81 L272 81\"/><path d=\"M331 90 L150 128\"/></g>\n<g fill=\"#fff\" stroke=\"#3a4d5f\" stroke-width=\"1.5\"><circle cx=\"70\" cy=\"79\" r=\"17\"/><circle cx=\"131\" cy=\"128\" r=\"17\"/><circle cx=\"137\" cy=\"29\" r=\"17\"/><circle cx=\"257\" cy=\"82\" r=\"17\"/><circle cx=\"350\" cy=\"82\" r=\"17\"/></g>\n<g fill=\"#192c41\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\"><text x=\"70\" y=\"85\">a</text><text x=\"131\" y=\"134\">b</text><text x=\"137\" y=\"35\">c</text><text x=\"257\" y=\"88\">Δ</text><text x=\"350\" y=\"88\">z</text></g>\n</svg><p class=\"details\">Wzór relacji i kolorów. Zaprojektuj własne rozmieszczenie węzłów i połączeń w TikZ.</p></details>"},{"name":"Zakończenie","heading":"Sprawdź i zachowaj wyniki","intro":"Na końcu zabezpiecz dokument, a komputer laboratoryjny pozostaw bez własnych plików","items":[{"label":"Wykonaj ostateczną kompilację","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Sprawdź wynik wprowadzenie.pdf","code":null,"detail":"Zobacz krój pisma, rysunek, tabelę, cztery równania, spisy, odwołania i graf TikZ","kind":"text"},{"label":"Zapisz kopię projektu","code":null,"detail":"Skopiuj wprowadzenie.tex i wprowadzenie.pdf na własny nośnik lub do zatwierdzonego miejsca","kind":"text"},{"label":"Sprawdź pliki, zanim uporządkujesz stanowisko","code":"ls -la ~/cw4","detail":null,"kind":"code"},{"label":"Po potwierdzeniu kopii usuń katalog interaktywnie","code":"rm -rI -- ~/cw4","detail":"Ta operacja usuwa katalog i pyta o potwierdzenie; nie używaj jej przed wykonaniem kopii","kind":"code"}],"tail":null}],"questions":[{"q":"Która deklaracja ustawia dwustronną książkę z czcionką 12 pt?","a":["\\documentclass[12pt,twoside]{book}","\\documentclass{article}","\\usepackage[12pt]{book}","\\begin{document}[twoside]"],"ok":0,"why":"Klasa book z opcjami 12pt i twoside spełnia oba warunki."},{"q":"Jakim poleceniem uzyskuje się pogrubienie tekstu?","a":["\\textit{tekst}","\\textbf{tekst}","\\underline{tekst}","\\textsl{tekst}"],"ok":1,"why":"textbf nadaje pogrubienie; textsl pochylenie, textit kursywę."},{"q":"Które środowisko tworzy listę numerowaną?","a":["itemize","figure","enumerate","tabular"],"ok":2,"why":"enumerate numeruje elementy, itemize tworzy wypunktowanie."},{"q":"Jak wstawić podpis do środowiska figure?","a":["\\caption{Tytuł}","\\label{Tytuł}","\\title{Tytuł}","\\section{Tytuł}"],"ok":0,"why":"caption dodaje podpis i nadaje numer rysunkowi lub tabeli."},{"q":"Co rozdziela kolejne kolumny w tabular?","a":["\\item","&","//","#"],"ok":1,"why":"Znak & oddziela kolumny, a podwójny ukośnik odwrotny kończy wiersz."},{"q":"Który zapis poprawnie przedstawia pierwiastek w liczniku ułamka?","a":["\\sqrt{\\frac{b}{2a}}","\\frac{-b+\\Delta}{2a}","\\frac{-b+\\sqrt{\\Delta}}{2a}","\\sum{-b+\\Delta}{2a}"],"ok":2,"why":"frac definiuje ułamek, sqrt pierwiastek wyróżnika."},{"q":"Jak odwołać się do rysunku z etykietą fig:przyklad?","a":["\\caption{fig:przyklad}","\\cite{fig:przyklad}","\\footnote{fig:przyklad}","\\ref{fig:przyklad}"],"ok":3,"why":"ref zwraca numer przypisany etykiecie przez label."},{"q":"Jak zapisać dosłowny znak procenta w zwykłym tekście LaTeX?","a":["%","\\%","\\textit{%}","\\#"],"ok":1,"why":"Niepoprzedzony ukośnikiem procent rozpoczyna komentarz."},{"q":"Które polecenie generuje spis tabel?","a":["\\tableofcontents","\\listoffigures","\\listoftables","\\bibliography{tables}"],"ok":2,"why":"listoftables tworzy spis podpisów tabel."},{"q":"Jak w PGF/TikZ narysować skierowaną krawędź od a do b?","a":["\\draw[->] (a) -- (b);","\\label[->] (a,b);","\\caption{a->b}","\\node[->] (a) to (b);"],"ok":0,"why":"draw z opcją -> i współrzędnymi węzłów generuje strzałkę."}],"starter":{"wprowadzenie.tex":"\\documentclass[12pt,a4paper,twoside]{book}\n\\usepackage[T1]{fontenc}\n\\usepackage[utf8]{inputenc}\n\\usepackage[polish]{babel}\n\\usepackage{lmodern}\n\\usepackage{lipsum}\n\n\\title{Skład tekstu w praktyce}\n\\author{Student}\n\\date{\\today}\n\n\\begin{document}\n\\maketitle\n\\part{Podstawy składu}\n\\chapter{Pierwszy dokument}\n\\section{Wprowadzenie}\n\\subsection{Pierwszy akapit}\n\\lipsum[1]\n\n\\section{Krój pisma}\n\n\\section{Środowiska}\n\n\\section{Wzory matematyczne}\n\n\\section{Odwołania}\n\n\\section{Znaki specjalne}\n\n\\section{Rysunki w PGF/TikZ}\n\n\\end{document}\n"}};
const STEPS=CONFIG.steps;
const QUESTIONS=CONFIG.questions;
const STARTER=CONFIG.starter||{};
let current=0,completed=false,report=null;
const quizAnswers=Array(QUESTIONS.length).fill(null);
let quizAlbum='';
const $=id=>document.getElementById(id);
function esc(value){return String(value).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function commandSteps(items){
 return '<ol class="task-list">'+items.map(({label,code,detail,kind})=>
  '<li class="task '+(code?'':'text-only')+'"><div class="task-label">'+esc(label)+'</div>'+
  (code?'<pre><code>'+esc(code)+'</code></pre>':'<div class="details">'+(kind==='starter'?'<div class="starter-files" id="starterFiles"></div>':'')+'</div>')+
  (detail?'<div class="detail">'+esc(detail)+'</div>':'')+'</li>').join('')+'</ol>';
}
function btn(label,variant,fn){const x=document.createElement('button');x.type='button';x.className='btn '+variant;x.textContent=label;x.addEventListener('click',fn);return x;}
function downloadFile(filename,contents,mime){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.download=filename;a.href=url;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function show(n){
 if(completed && n!==STEPS.length+1)return;
 if(n<0||n>STEPS.length+1 || (n===STEPS.length+1&&!completed))return;
 current=n;
 const all=STEPS.map(s=>s.name).concat(['Test','Wyniki']);
 $('nav').replaceChildren();all.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className=i===n?'active':'';b.disabled=(completed&&i!==n)||(!completed&&i===STEPS.length+1);b.innerHTML='<span>'+String(i+1)+'</span>'+esc(name);b.setAttribute('aria-current',i===n?'step':'false');b.addEventListener('click',()=>show(i));$('nav').append(b);});
 $('progress').innerHTML=all.map((_,i)=>'<i class="'+(i<=n?'current':'')+'"></i>').join('');
 const c=$('content');
 if(n<STEPS.length){const s=STEPS[n];c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>'+esc(s.heading)+'</h2><p>'+s.intro+'</p>'+commandSteps(s.items)+(s.tail?'<div class="hint">'+s.tail+'</div>':'');
  const holder=$('starterFiles');if(holder){Object.entries(STARTER).forEach(([filename,contents])=>{const b=document.createElement('button');b.type='button';b.textContent=filename;b.addEventListener('click',()=>downloadFile(filename,contents,'text/plain;charset=utf-8'));holder.append(b);});}
 }else if(n===STEPS.length){c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Sprawdź wiedzę</h2><p>10 pytań, po cztery odpowiedzi. Wybierz po jednej. Wyniki zostaną pokazane po zakończeniu.</p><p class="album"><label for="album">Numer albumu (opcjonalnie): </label><input id="album" type="text" inputmode="numeric" maxlength="12" autocomplete="off"></p><form id="quiz" novalidate></form>';drawQuiz();$('album').value=quizAlbum;$('album').addEventListener('input',e=>quizAlbum=e.target.value);
 }else{c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Wynik podejścia</h2><div id="results"></div>';drawResults();}
 const a=$('actions');a.replaceChildren();if(n>0&&!completed)a.append(btn('Poprzedni','',()=>show(n-1)));
 if(n<STEPS.length)a.append(btn('Następny','primary',()=>show(n+1)));
 else if(n===STEPS.length&&!completed)a.append(btn('Zakończ i oceń','teal',grade));
 else if(n===STEPS.length+1)a.append(btn('Zapisz wynik JSON','primary',saveReport));
 window.scrollTo(0,0);
}
function drawQuiz(){const form=$('quiz');QUESTIONS.forEach((q,i)=>{
 const field=document.createElement('fieldset');field.className='question';const legend=document.createElement('legend');legend.innerHTML=String(i+1)+'. '+q.q;field.append(legend);
 const choices=document.createElement('div');choices.className='answer';q.a.forEach((answer,k)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=String(k);radio.autocomplete='off';radio.checked=quizAnswers[i]===k;radio.addEventListener('change',()=>quizAnswers[i]=k);label.append(radio,document.createTextNode(answer));choices.append(label);});field.append(choices);form.append(field);});}
function grade(){if(completed)return;
 const vals=quizAnswers.slice();
 const missing=vals.filter(x=>x===null).length;if(missing){alert('Odpowiedz na wszystkie pytania. Brak: '+missing+'.');return;}
 const album=$('album').value.trim();if(album&&!/^\d{1,12}$/.test(album)){alert('Numer albumu musi zawierać od 1 do 12 cyfr.');return;}
 const score=vals.reduce((n,a,i)=>n+Number(a===QUESTIONS[i].ok),0);
 report={schema:'ndp-lab-assessment/1.0',exercise:CONFIG.id,finished_at:new Date().toISOString(),album:album||null,score,max_score:10,percent:score*10,answers:vals.map((answer,i)=>({number:i+1,answer_index:answer,correct:answer===QUESTIONS[i].ok}))};
 completed=true;show(STEPS.length+1);
}
function drawResults(){if(!report)return;const r=$('results');r.innerHTML='<div class="kpis"><div class="kpi">Punkty<strong>'+report.score+' / 10</strong></div><div class="kpi">Wynik<strong>'+report.percent+'%</strong></div></div><p class="details">Poniżej podano ocenę odpowiedzi i poprawne rozwiązania.</p>';
 QUESTIONS.forEach((q,i)=>{const isCorrect=report.answers[i].correct;const b=document.createElement('div');b.className='result-item '+(isCorrect?'good':'');
 const h=document.createElement('strong');h.textContent=(i+1)+'. '+(isCorrect?'Poprawnie':'Błąd')+' · '+q.q.replace(/<[^>]*>/g,'');b.append(h);
 const v=document.createElement('p');v.textContent='Twoja odpowiedź: '+q.a[report.answers[i].answer_index];b.append(v);
 if(!isCorrect){const c=document.createElement('p');c.textContent='Poprawna odpowiedź: '+q.a[q.ok];b.append(c);}
 const why=document.createElement('p');why.className='details';why.textContent=q.why;b.append(why);r.append(b);});
 const p=document.createElement('p');p.className='details';p.textContent='Raport możesz zapisać na komputerze. Nie jest wysyłany automatycznie.';r.append(p);
}
function saveReport(){if(!report)return;downloadFile('ndp_lab_'+CONFIG.number+'_wynik_'+(report.album||'anonim')+'.json',JSON.stringify(report,null,2)+'\n','application/json;charset=utf-8');}
show(0);
</script>
</body>
</html>
