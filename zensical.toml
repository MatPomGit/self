[project]
site_name = "Mateusz Pomianek"
site_url = "https://matpomgit.github.io/self/"
site_description = "Badania, projekty, publikacje i dydaktyka"
site_author = "Mateusz Pomianek"
docs_dir = "website/pl"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]
copyright = "Mateusz Pomianek · v1.3.0"
nav = [
  { "Strona główna" = "index.md" },
  { "Badania" = "research.md" },
  { "Projekty" = "projects.md" },
  { "Publikacje" = "publications.md" },
  { "Dla studentów" = "teaching.md" },
  { "Kontakt" = "contact.md" },
]

[project.theme]
variant = "modern"
language = "pl"
font = false
custom_dir = "website/overrides"
features = ["navigation.tabs", "navigation.top"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Tryb ciemny"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Tryb jasny"

[project.extra]
generator = false
alternate = [
  { name = "Polski", link = "/self/", lang = "pl" },
  { name = "English", link = "/self/en/", lang = "en" },
]
