name: Issue 138 – warm trusted extraction cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-138-audit.yml
      - .github/workflows/issue-138-cache-warm.yml
      - scripts/audit_content_overlap.py
      - files/inne/analizy/**
      - files/ignored/inne/analizy/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-138-cache-warm-main
  cancel-in-progress: false

jobs:
  warm:
    # Only trusted push/dispatch can save cache. Never execute PR head code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline extraction dependencies
        run: python -m pip install "pypdf>=5,<7"
      - name: Restore or reserve trusted cache for current main
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/issue-138-extraction-cache
          key: issue138-extraction-v1-${{ runner.os }}-${{ github.sha }}-both
          restore-keys: |
            issue138-extraction-v1-${{ runner.os }}-
      - name: Populate verified SHA-256 extraction cache without publishing excerpts
        env:
          CACHE_DIR: ${{ runner.temp }}/issue-138-extraction-cache
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.audit_content_overlap import ExtractionCache, compute
          root = Path.cwd()
          cache = ExtractionCache(root, Path(os.environ["CACHE_DIR"]))
          for label, directory in (
              ("active", "files/inne/analizy"),
              ("archive", "files/ignored/inne/analizy"),
          ):
              result = compute(root, root / directory, cache=cache)
              print("CACHE_WARM_SCOPE " + json.dumps({
                  "scope": label,
                  "files": result["counts"]["files"],
                  "incomplete": result["counts"]["extraction_incomplete"],
              }, sort_keys=True))
          print("CACHE_WARM_TOTAL " + json.dumps(cache.stats(), sort_keys=True))
          PY
