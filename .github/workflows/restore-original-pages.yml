name: Publish original self website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-self-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF page parser
        run: python -m pip install "pypdf>=5,<7" "numpy>=1.26,<3"
      - name: Install local document converters for canonical downloads
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 140 && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! command -v pandoc >/dev/null || ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc libreoffice-writer fonts-dejavu-core
          fi
      - name: Generate canonical DOCX/PDF from reviewed Markdown
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 140 && github.event.pull_request.head.repo.full_name == github.repository
        run: python scripts/build_consolidated_downloads.py
      - name: Validate source links before automatic index repair
        run: python -m unittest discover -s tests -p "test_source_links.py" -v
      - name: Quarantine malformed materials (temporary runner only)
        run: python scripts/preflight_materials.py --quarantine
      - name: Discover and reconcile all materials
        run: |
          python scripts/sync_materials.py --write --repair-missing
          python scripts/sync_materials.py --check
      - name: Classify materials by page dimensions
        run: |
          python scripts/classify_materials.py --write
          python scripts/classify_materials.py --check
      - name: Validate short PDF routes
        run: python scripts/build_short_links.py --site . --check
      - name: Validate Python content, metadata and links
        run: python -m unittest discover -s tests -v
      - name: Pilot content-overlap audit (read-only, PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python scripts/audit_content_overlap.py --scope files/inne/analizy --output-dir "$RUNNER_TEMP/content-audit" --top 20 --ci-summary
      - name: Compare passage differences in pilot report pairs
        if: github.event_name == 'pull_request'
        run: |
          python scripts/audit_report_differences.py --scope files/inne/analizy --output-dir "$RUNNER_TEMP/content-audit" --ci-summary
      - name: Extract source passages for scientific claim review
        if: github.event_name == 'pull_request'
        run: |
          python scripts/audit_repeated_claims.py --scope files/inne/analizy --output-dir "$RUNNER_TEMP/content-audit"
      - name: Prepare non-destructive draft consolidation of two P0 reports
        if: github.event_name == 'pull_request'
        run: |
          python scripts/prepare_consolidation_drafts.py --scope files/ignored/inne/analizy --output-dir "$RUNNER_TEMP/content-audit/consolidation"
      - name: Save content-overlap pilot report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: content-overlap-pilot
          path: ${{ runner.temp }}/content-audit/
          retention-days: 7
          if-no-files-found: warn
      - name: Attach generated canonical downloads for the release commit
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 140 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: canonical-report-downloads
          path: |
            files/inne/analizy/analiza_afektywna.docx
            files/inne/analizy/analiza_afektywna.pdf
            files/inne/analizy/isaac_lab.docx
            files/inne/analizy/isaac_lab.pdf
          retention-days: 3
          if-no-files-found: error
      - name: Validate JavaScript syntax and interactive behavior
        run: |
          node --check docs/assets/js/site-i18n.js
          node --check docs/assets/js/publication-utils.js
          node --check tests/test_materials_layout.js
          node --check tests/test_about.js
          node tests/test_language.js
          node tests/test_about.js
          node tests/test_publication_utils.js
          node tests/test_404.js
          node tests/test_materials_view.js
      - name: Validate responsive materials layout
        run: node tests/test_materials_layout.js
      - name: Validate theme switching
        run: bash tests/theme_switcher_static_check.sh
      # Upload the exact checked files once; deploy job must not rebuild.
      - name: Package validated website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -a docs files materials _site/
          # ignored archives are tracked in Git but NEVER shipped to public Pages.
          rm -rf _site/files/ignored
          python scripts/build_short_links.py --site _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site
          include-hidden-files: true
          retention-days: 3
  commit-canonical-downloads:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 140 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: canonical-report-downloads
          path: files/inne/analizy/
      - name: Commit checked DOCX/PDF to PR branch (not main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- files/inne/analizy/analiza_afektywna.docx files/inne/analizy/analiza_afektywna.pdf files/inne/analizy/isaac_lab.docx files/inne/analizy/isaac_lab.pdf
          if git diff --cached --quiet; then
            echo "No changed downloads to commit."
          else
            git commit -m "docs(files): publish canonical affective and Isaac Lab downloads"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy previously validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
