name: Rebuild canonical research report downloads

on:
  push:
    branches:
      - audit/isaac-ndd-evidence-20261112
    paths:
      - "docs/consolidated/isaac_lab.md"
      - "docs/consolidated/telediagnostyka_ndd.md"
      - "scripts/build_consolidated_downloads.py"
      - "tests/test_consolidated_reports.py"
      - ".github/workflows/rebuild-research-reports.yml"

permissions:
  contents: write

concurrency:
  group: canonical-report-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.repository == 'MatPomGit/self' &&
      github.actor == 'MatPomGit' &&
      github.ref == 'refs/heads/audit/isaac-ndd-evidence-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice-writer
          python -m pip install "pypdf>=5,<7" "pytest>=8,<10"
      - name: Validate editorial content
        run: python -m pytest tests/test_consolidated_reports.py tests/test_review_pending_reports.py -q
      - name: Generate and validate the changed DOCX and PDF reports
        run: |
          python scripts/build_consolidated_downloads.py \
            --only isaac_lab --only telediagnostyka_ndd
      - name: Check text of generated reports
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          root = Path("files/inne/analizy")
          for name, marker in (("isaac_lab", "Core API i migracja"),
                               ("telediagnostyka_ndd", "Trzy różne badania")):
              pdf = root / (name + ".pdf")
              docx = root / (name + ".docx")
              assert pdf.is_file() and docx.is_file()
              text = " ".join((p.extract_text() or "") for p in PdfReader(str(pdf)).pages)
              assert marker in text, (name, marker)
              print(name, "PDF pages:", len(PdfReader(str(pdf)).pages))
          PY
      - name: Commit generated downloads on this owner-controlled branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- files/inne/analizy/isaac_lab.docx files/inne/analizy/isaac_lab.pdf \
            files/inne/analizy/telediagnostyka_ndd.docx files/inne/analizy/telediagnostyka_ndd.pdf
          if git diff --cached --quiet; then
            echo "CANONICAL_REPORTS_UNCHANGED"
          else
            git commit -m "build(reports): synchronize Isaac and NDD DOCX/PDF with canonical Markdown"
            git push origin HEAD:refs/heads/audit/isaac-ndd-evidence-20261112
          fi
