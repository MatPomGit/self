name: Sprawdzenie motywu self
on:
  pull_request:
    paths: ["index.html", "docs/data/projects.json", "materials/index.html", "tests/test_theme.py", "tests/test_materials.py", "tests/test_materials_view.js", "tests/test_classify_materials.py", "scripts/classify_materials.py", "tests/test_projects.py", ".github/workflows/test-theme.yml"]
  push:
    branches: [main]
    paths: ["index.html", "docs/data/projects.json", "materials/index.html", "tests/test_theme.py", "tests/test_materials.py", "tests/test_materials_view.js", "tests/test_classify_materials.py", "scripts/classify_materials.py", "tests/test_projects.py", ".github/workflows/test-theme.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pypdf>=5,<7"
      - run: python scripts/classify_materials.py --write
      - run: python scripts/classify_materials.py --check
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: node tests/test_materials_view.js
