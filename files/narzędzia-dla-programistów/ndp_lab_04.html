<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>NDP | Laboratorium 04 | Tworzenie dokumentów LaTeX</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172c40;background:#f2f5f8;line-height:1.42}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #087e8b;outline-offset:2px}
header{background:#003c82;color:#fff;padding:13px max(14px,calc((100vw - 1220px)/2));border-bottom:3px solid #087e8b}
header h1{margin:0;font-size:1.13rem;letter-spacing:.005em}header p{margin:2px 0 0;color:#e0f2fc;font-size:.85rem}
.layout{max-width:1220px;margin:14px auto 28px;display:grid;grid-template-columns:188px minmax(0,1fr);gap:12px;padding:0 12px}
aside{align-self:start;position:sticky;top:12px;border:1px solid #d8e2eb;border-radius:10px;background:white;padding:12px}
aside h2{font-size:.91rem;margin:0 0 9px}.nav{display:grid;gap:3px}.nav button{text-align:left;border:0;background:transparent;color:#304b61;border-radius:6px;padding:7px 8px;display:flex;align-items:center;gap:8px;font-size:.89rem;min-height:36px}
.nav span{font-size:.76rem;border:1px solid #b9cad9;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;flex-shrink:0}
.nav .active{background:#e8f1f8;color:#003c82;font-weight:700}
main{min-width:0}.paper{background:white;border:1px solid #d8e2eb;border-radius:10px;padding:17px 22px 20px;min-height:375px}
.section-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.step-count{color:#087e8b;font-size:.76rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.32rem;line-height:1.2;margin:5px 0 9px}p{margin:8px 0}.muted{color:#475c70;font-size:.89rem}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}p code,li code{background:#eaf0f5;color:#142638;border-radius:3px;padding:1px 4px}
.task-list{margin:9px 0 0;padding:0;list-style:none;counter-reset:task;display:grid;gap:5px}.task{counter-increment:task;display:grid;grid-template-columns:minmax(170px,.87fr) minmax(0,1.5fr);align-items:start;gap:12px;padding:8px 10px;border:1px solid #e0e8ef;border-radius:7px;background:#fcfdff}
.task-label{display:flex;align-items:flex-start;gap:8px;font-size:.9rem;font-weight:590;line-height:1.35;padding-top:5px}.task-label::before{content:counter(task) ".";color:#087e8b;font-weight:800;flex-shrink:0;min-width:21px}
.task pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf1f7;color:#0d283e!important;padding:8px 11px;border:1px solid #cbdce9;border-radius:5px;font-size:.9rem;line-height:1.37;tab-size:2;user-select:text}
.task pre code{color:#0d283e!important;background:transparent!important;font-size:inherit!important;white-space:inherit}
.task .detail{grid-column:2;font-size:.79rem;color:#42596c;margin-top:-5px}.task.text-only .detail{grid-column:2;margin-top:2px}
.hint{font-size:.86rem;color:#425568;border-left:3px solid #087e8b;background:#f2f8fa;padding:8px 11px;margin-top:12px}
.progress{height:4px;display:flex;gap:4px;margin-bottom:13px}.progress i{border-radius:5px;background:#e0e8ef;flex:1}.progress .current{background:#087e8b}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #e6edf2;margin-top:16px;padding-top:14px}
.btn{font-size:.88rem;font-weight:700;padding:8px 15px;border-radius:6px;border:1px solid #c2d2df;color:#003c82;background:white}.btn.primary{background:#003c82;border-color:#003c82;color:white}.btn.teal{background:#087e8b;border-color:#087e8b;color:white}
.starter-files{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}.starter-files button{border:1px solid #abc1d2;background:#eaf4f8;color:#003c82;border-radius:6px;font-size:.8rem;padding:5px 9px}
.question{margin:7px 0;padding:10px 12px 11px;border:1px solid #dde7ef;border-radius:7px;min-width:0}.question legend{font-weight:680;font-size:.93rem;padding:0 4px}
.answer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.answer label{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid #dce5ec;border-radius:5px;font-size:.85rem;cursor:pointer;line-height:1.3}
.answer label:has(input:checked){border-color:#087e8b;background:#ecf8f7}.answer input{flex-shrink:0;accent-color:#087e8b;margin-top:3px}
.details{font-size:.84rem;color:#495c6a}.album{margin:12px 0}.album input{max-width:160px;border:1px solid #c1d0db;border-radius:5px;padding:6px}
.kpis{display:flex;gap:9px;margin:11px 0}.kpi{border:1px solid #cddde6;border-radius:7px;padding:10px 15px;background:#f4f9fb}.kpi strong{display:block;font-size:1.35rem;color:#003c82}
.result-item{margin:7px 0;padding:10px 12px;border:1px solid #dde6ed;border-left:4px solid #b45539;border-radius:5px;font-size:.87rem}.result-item.good{border-left-color:#178055}.result-item p{margin:3px 0}
footer{max-width:1220px;margin:0 auto 24px;padding:0 15px;color:#687a88;font-size:.77rem;text-align:right}
@media(max-width:880px){.layout{grid-template-columns:1fr}.nav{display:flex;flex-wrap:wrap}.nav button{flex:1;min-width:95px;justify-content:center}.nav span{display:none}aside{position:static}}
@media(max-width:650px){header{padding:12px}.paper{padding:13px}.task{grid-template-columns:1fr;gap:5px;padding:9px}.task .detail{grid-column:1;margin-top:0}.task-label{padding-top:0}.answer{grid-template-columns:1fr}}
@media print{body{background:white}header{background:white;color:black;border-bottom:1px solid #ccc}.layout{display:block;margin:0}aside,.actions,.progress{display:none!important}.paper{border:0;padding:0}.task{break-inside:avoid}}

/* Shared NDP Basic dark palette: also applies when embedded in ndp_laboratoria.html. */
html[data-theme="dark"]{color-scheme:dark;--bg:#0d151b;--paper:#131f27;--ink:#e8f0f4;--muted:#b2c5d0;--line:#344d5d;--accent:#63d5de;--accent-2:#4dd2bd;background:#0d151b!important;color:#e8f0f4!important}
html[data-theme="dark"] body{background:#0d151b!important;color:#e8f0f4!important}

html[data-theme="dark"] header p{color:#d5eaf5!important}
html[data-theme="dark"] aside,html[data-theme="dark"] .paper{background:#131f27!important;border-color:#344d5d!important;color:#e8f0f4!important}
html[data-theme="dark"] h2,html[data-theme="dark"] aside h2,html[data-theme="dark"] .question legend{color:#e8f0f4!important}
html[data-theme="dark"] .nav button{color:#d1e4ee!important;background:transparent!important}
html[data-theme="dark"] .nav button:hover{background:#213b4b!important}
html[data-theme="dark"] .nav button.active,html[data-theme="dark"] .nav .active{background:#244b5e!important;color:#e5fbff!important}
html[data-theme="dark"] .nav span{border-color:#4a7587!important;color:#d6edf5!important}
html[data-theme="dark"] .muted,html[data-theme="dark"] .details,html[data-theme="dark"] .task .detail{color:#b6c8d5!important}
html[data-theme="dark"] .step-count,html[data-theme="dark"] .task-label::before{color:#70d6de!important}
html[data-theme="dark"] .task,html[data-theme="dark"] .question,html[data-theme="dark"] .result-item{background:#172630!important;border-color:#344d5d!important;color:#e8f0f4!important}
html[data-theme="dark"] .task pre,html[data-theme="dark"] .task pre code{background:#0c2535!important;color:#edf8ff!important;border-color:#36566a!important}
html[data-theme="dark"] p code,html[data-theme="dark"] li code{background:#223c4d!important;color:#e0f4ff!important}
html[data-theme="dark"] .hint{background:#173541!important;border-left-color:#48c5d0!important;color:#d3e6ee!important}
html[data-theme="dark"] .progress i{background:#304758!important}
html[data-theme="dark"] .progress .current{background:#56cbd6!important}
html[data-theme="dark"] .actions{border-top-color:#344d5d!important}
html[data-theme="dark"] .btn{background:#203848!important;border-color:#507083!important;color:#e5f4fa!important}
html[data-theme="dark"] .btn:hover{background:#2d5063!important}
html[data-theme="dark"] .btn.primary,html[data-theme="dark"] .btn.teal,html[data-theme="dark"] .btn.primary:hover,html[data-theme="dark"] .btn.teal:hover{background:#176d83!important;border-color:#4bc9d8!important;color:#fff!important}
html[data-theme="dark"] .primary:not(.btn){background:#176d83!important;border-color:#4bc9d8!important;color:#fff!important}
html[data-theme="dark"] .starter-files button{background:#203b4c!important;border-color:#507083!important;color:#d7f4ff!important}
html[data-theme="dark"] .answer label{background:#192d3b!important;color:#e6f2f8!important;border-color:#3b586c!important}
html[data-theme="dark"] .answer label:has(input:checked){background:#174c50!important;border-color:#65d7d0!important}
html[data-theme="dark"] .answer input{accent-color:#65d7d0!important}
html[data-theme="dark"] .album input{background:#152938!important;color:#e8f0f4!important;border:1px solid #577386!important}
html[data-theme="dark"] .kpi{background:#1a3040!important;border-color:#3b586c!important;color:#e8f0f4!important}
html[data-theme="dark"] .kpi strong{color:#85dcec!important}
html[data-theme="dark"] .result-item.good{border-left-color:#63d7a0!important}
html[data-theme="dark"] footer{color:#b4c6d1!important}
html[data-theme="dark"] :focus-visible{outline-color:#74e1dd!important}
@media print{html[data-theme="dark"]{color-scheme:light!important;background:white!important;color:black!important}html[data-theme="dark"] body{background:white!important;color:black!important}}

</style>

Mniejszy tekst}","detail":null,"kind":"code"},{"label":"Zbuduj dokument po zmianach.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Pismo pochylone (<code>textsl</code>) i kursywa (<code>textit</code>) to różne odmiany kroju."},{"name":"Listy","heading":"Zbuduj wyliczenie i wypunktowanie","intro":"Fragmenty wstawiaj w sekcji <code>Środowiska</code>. Nie umieszczaj dwóch poleceń terminalowych w jednej ramce.","items":[{"label":"Rozpocznij listę numerowaną.","code":"\\begin{enumerate}","detail":null,"kind":"code"},{"label":"Dodaj pierwszy element.","code":"\\item Pierwsza czynność","detail":null,"kind":"code"},{"label":"Dodaj drugi element.","code":"\\item Druga czynność","detail":null,"kind":"code"},{"label":"Zakończ wyliczenie.","code":"\\end{enumerate}","detail":null,"kind":"code"},{"label":"Rozpocznij wypunktowanie.","code":"\\begin{itemize}","detail":null,"kind":"code"},{"label":"Dodaj element pierwszy.","code":"\\item Materiał źródłowy","detail":null,"kind":"code"},{"label":"Dodaj element drugi.","code":"\\item Dokument wynikowy","detail":null,"kind":"code"},{"label":"Zakończ wypunktowanie.","code":"\\end{itemize}","detail":null,"kind":"code"}],"tail":null},{"name":"Grafika","heading":"Wstaw rysunek i tabelę","intro":"Kontynuuj pracę w sekcji <code>Środowiska</code>. Przykładowy rysunek nie wymaga pobierania pliku graficznego.","items":[{"label":"Rozpocznij środowisko figure.","code":"\\begin{figure}[htbp]","detail":null,"kind":"code"},{"label":"Wycentruj rysunek.","code":"\\centering","detail":null,"kind":"code"},{"label":"Wstaw tymczasową grafikę.","code":"\\fbox{\\rule{0pt}{14mm}\\rule{36mm}{0pt}}","detail":null,"kind":"code"},{"label":"Dodaj podpis.","code":"\\caption{Przykładowy rysunek}","detail":null,"kind":"code"},{"label":"Dodaj etykietę rysunku.","code":"\\label{fig:przyklad}","detail":null,"kind":"code"},{"label":"Zakończ środowisko figure.","code":"\\end{figure}","detail":null,"kind":"code"},{"label":"Rozpocznij tabelę.","code":"\\begin{table}[htbp]","detail":null,"kind":"code"},{"label":"Wstaw podpis nad tabelą.","code":"\\caption{Wyniki pomiarów}","detail":null,"kind":"code"},{"label":"Ustaw etykietę tabeli.","code":"\\label{tab:pomiary}","detail":null,"kind":"code"},{"label":"Wycentruj tabelę.","code":"\\centering","detail":null,"kind":"code"},{"label":"Zadeklaruj trzy kolumny.","code":"\\begin{tabular}{|c|c|c|}\\hline","detail":null,"kind":"code"},{"label":"Dodaj nagłówek.","code":"Pomiar & A & B \\\\ \\hline","detail":null,"kind":"code"},{"label":"Dodaj wiersz pierwszy.","code":"1 & 10 & 20 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz drugi.","code":"2 & 11 & 21 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz trzeci.","code":"3 & 12 & 22 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz czwarty.","code":"4 & 13 & 23 \\\\","detail":null,"kind":"code"},{"label":"Dodaj wiersz piąty.","code":"5 & 14 & 24 \\\\ \\hline","detail":null,"kind":"code"},{"label":"Zakończ środowisko tabular.","code":"\\end{tabular}","detail":null,"kind":"code"},{"label":"Zakończ środowisko table.","code":"\\end{table}","detail":null,"kind":"code"},{"label":"Przekompiluj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Tabela zawiera trzy kolumny, pięć wierszy danych i osobny wiersz nagłówkowy. Numer i podpis umieszcza się w otoczeniu <code>table</code>."},{"name":"Wzory","heading":"Wprowadź wzory matematyczne","intro":"Zamieść cztery niezależne środowiska <code>equation</code> w sekcji <code>Wzory matematyczne</code>. Każdy fragment jest kompletnym równaniem.","items":[{"label":"Zapisz wzór na pole koła.","code":"\\begin{equation}\\label{eq:pole}\nS = \\pi r^{2}\n\\end{equation}","detail":null,"kind":"code"},{"label":"Zdefiniuj wyróżnik trójmianu.","code":"\\begin{equation}\\label{eq:delta}\n\\Delta = b^{2} - 4ac\n\\end{equation}","detail":null,"kind":"code"},{"label":"Zapisz pierwsze miejsce zerowe.","code":"\\begin{equation}\\label{eq:x1}\nx_1 = \\frac{-b - \\sqrt{\\Delta}}{2a}\n\\end{equation}","detail":null,"kind":"code"},{"label":"Zapisz drugie miejsce zerowe.","code":"\\begin{equation}\\label{eq:x2}\nx_2 = \\frac{-b + \\sqrt{\\Delta}}{2a}\n\\end{equation}","detail":null,"kind":"code"},{"label":"Skompiluj cztery równania.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Ułamki i pierwiastki zapisuj poleceniami <code>\\frac</code> oraz <code>\\sqrt</code>; indeks dolny przez <code>_</code>."},{"name":"Odwołania","heading":"Odwołania i przypisy","intro":"W sekcji <code>Odwołania</code> dodaj zdania zawierające odwołania do wcześniej zdefiniowanych etykiet.","items":[{"label":"Odwołaj się do rysunku.","code":"Rysunek~\\ref{fig:przyklad} prezentuje przykład","detail":null,"kind":"code"},{"label":"Odwołaj się do tabeli.","code":"Wyniki umieszczono w tabeli~\\ref{tab:pomiary}","detail":null,"kind":"code"},{"label":"Odwołaj się do wzoru.","code":"Pole koła oblicza wzór~(\\ref{eq:pole})","detail":null,"kind":"code"},{"label":"Wstaw przypis dolny.","code":"Jest to przypis\\footnote{Tekst przypisu na dole strony}","detail":null,"kind":"code"},{"label":"Uruchom pierwszą kompilację.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Ponów kompilację dla odwołań.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Po pierwszym przebiegu odwołania mogą wyświetlać znaki zapytania. Kolejny przebieg odczytuje plik <code>.aux</code>."},{"name":"Znaki","heading":"Znaki specjalne i spisy","intro":"Zapisz znaki specjalne w sekcji <code>Znaki specjalne</code>, a spisy dodaj bezpośrednio po <code>\\maketitle</code>.","items":[{"label":"Wstaw znaki $, #, %, ^, &.","code":"\\$ \\# \\% \\^{} \\&","detail":null,"kind":"code"},{"label":"Wstaw cudzysłów oraz nawiasy kwadratowe.","code":"\\textquotedbl{} [ ]","detail":null,"kind":"code"},{"label":"Wstaw ukośnik odwrotny i tyldę.","code":"\\textbackslash{} \\textasciitilde{}","detail":null,"kind":"code"},{"label":"Wstaw nawiasy klamrowe.","code":"\\{ \\}","detail":null,"kind":"code"},{"label":"Wstaw kreskę pionową, podkreślenie i @.","code":"\\textbar{} \\_ @","detail":null,"kind":"code"},{"label":"Wstaw spis treści po stronie tytułowej.","code":"\\tableofcontents","detail":null,"kind":"code"},{"label":"Dodaj spis rysunków.","code":"\\listoffigures","detail":null,"kind":"code"},{"label":"Dodaj spis tabel.","code":"\\listoftables","detail":null,"kind":"code"},{"label":"Skompiluj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Ponów kompilację dla spisów.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Spisy i numeracja aktualizują się po kolejnych przebiegach kompilatora LaTeX."},{"name":"Dodatkowe","heading":"Zadania dodatkowe: grafy TikZ","intro":"Dodaj pakiet w preambule, a następne fragmenty umieść w sekcji <code>Rysunki w PGF/TikZ</code>. Po utworzeniu podstawowego grafu odtwórz jego rozszerzony wzór.","items":[{"label":"Dodaj pakiet w preambule.","code":"\\usepackage{tikz}","detail":null,"kind":"code"},{"label":"Rozpocznij środowisko figure.","code":"\\begin{figure}[htbp]","detail":null,"kind":"code"},{"label":"Wycentruj graf.","code":"\\centering","detail":null,"kind":"code"},{"label":"Rozpocznij środowisko grafu.","code":"\\begin{tikzpicture}[every node/.style={draw,circle,minimum size=7mm}]","detail":null,"kind":"code"},{"label":"Dodaj węzeł a.","code":"\\node (a) at (0,0) {a};","detail":null,"kind":"code"},{"label":"Dodaj węzeł b.","code":"\\node (b) at (1.2,-0.7) {b};","detail":null,"kind":"code"},{"label":"Dodaj węzeł c.","code":"\\node (c) at (1.2,0.7) {c};","detail":null,"kind":"code"},{"label":"Wstaw połączenie a → b.","code":"\\draw[->] (a) -- (b);","detail":null,"kind":"code"},{"label":"Wstaw zielone połączenie a → c.","code":"\\draw[->,green!60!black] (a) -- (c);","detail":null,"kind":"code"},{"label":"Dodaj przerywaną niebieską strzałkę.","code":"\\draw[->,dashed,blue] (c) -- ++(1,0);","detail":null,"kind":"code"},{"label":"Zakończ środowisko tikzpicture.","code":"\\end{tikzpicture}","detail":null,"kind":"code"},{"label":"Dodaj podpis.","code":"\\caption{Początkowy graf}","detail":null,"kind":"code"},{"label":"Zakończ środowisko figure.","code":"\\end{figure}","detail":null,"kind":"code"},{"label":"Rozbuduj graf do wzoru końcowego.","code":null,"detail":"W tym samym rysunku dodaj węzły Δ oraz z, dodatkowe krawędzie, kierunki i style z podglądu poniżej.","kind":"text"},{"label":"Zaprojektuj drugi graf według wzoru prowadzącego.","code":null,"detail":"Zadbaj o etykiety, kierunki i rodzaje krawędzi; zapisz wynik do PDF.","kind":"text"}],"tail":"<details class=\"graph-ref\"><summary>Otwórz wzór grafu do samodzielnego odtworzenia</summary>\n<svg role=\"img\" aria-label=\"Graf: węzły a, b, c, Delta oraz z; strzałki i połączenia w kilku stylach\" width=\"410\" height=\"150\" viewBox=\"0 0 410 150\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><marker id=\"gr4arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10Z\" fill=\"context-stroke\"/></marker></defs>\n<g fill=\"none\" stroke=\"#37495a\" stroke-width=\"1.6\" marker-end=\"url(#gr4arr)\"><path d=\"M83 89 L120 116\"/><path d=\"M147 38 L240 74\"/><path d=\"M145 123 L240 91\"/></g>\n<g stroke=\"#13874a\" stroke-width=\"2.2\" marker-end=\"url(#gr4arr)\"><path d=\"M83 73 L130 38\"/></g>\n<g stroke=\"#2460ac\" stroke-width=\"2\" stroke-dasharray=\"5 4\" marker-end=\"url(#gr4arr)\"><path d=\"M148 29 L196 29\"/></g>\n<path d=\"M83 80 L240 82\" stroke=\"#929ba5\" stroke-dasharray=\"2 3\" fill=\"none\" marker-end=\"url(#gr4arr)\"/>\n<g stroke=\"#cc3d3d\" stroke-width=\"2\" marker-end=\"url(#gr4arr)\"><path d=\"M329 81 L272 81\"/><path d=\"M331 90 L150 128\"/></g>\n<g fill=\"#fff\" stroke=\"#3a4d5f\" stroke-width=\"1.5\"><circle cx=\"70\" cy=\"79\" r=\"17\"/><circle cx=\"131\" cy=\"128\" r=\"17\"/><circle cx=\"137\" cy=\"29\" r=\"17\"/><circle cx=\"257\" cy=\"82\" r=\"17\"/><circle cx=\"350\" cy=\"82\" r=\"17\"/></g>\n<g fill=\"#192c41\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\"><text x=\"70\" y=\"85\">a</text><text x=\"131\" y=\"134\">b</text><text x=\"137\" y=\"35\">c</text><text x=\"257\" y=\"88\">Δ</text><text x=\"350\" y=\"88\">z</text></g>\n</svg><p class=\"details\">Wzór relacji i kolorów. Zaprojektuj własne rozmieszczenie węzłów i połączeń w TikZ.</p></details>"},{"name":"Zakończenie","heading":"Sprawdź i zachowaj wyniki","intro":"Na końcu zabezpiecz dokument, a na komputerze laboratoryjnym nie pozostawiaj własnych plików.","items":[{"label":"Wykonaj ostateczną kompilację.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Sprawdź wynik wprowadzenie.pdf.","code":null,"detail":"Zobacz krój pisma, rysunek, tabelę, cztery równania, spisy, odwołania i graf TikZ","kind":"text"},{"label":"Zapisz kopię projektu.","code":null,"detail":"Skopiuj wprowadzenie.tex i wprowadzenie.pdf na własny nośnik lub do zatwierdzonego miejsca","kind":"text"},{"label":"Sprawdź pliki, zanim uporządkujesz stanowisko.","code":"ls -la ~/cw4","detail":null,"kind":"code"},{"label":"Po potwierdzeniu kopii usuń katalog interaktywnie.","code":"rm -rI -- ~/cw4","detail":"Ta operacja usuwa katalog i pyta o potwierdzenie; nie używaj jej przed wykonaniem kopii","kind":"code"}],"tail":null}],"questions":[{"q":"Dokument ma być książką składaną dwustronnie, z krojem o rozmiarze 12 pt. Która deklaracja spełnia wszystkie trzy warunki?","a":["\\documentclass[12pt,oneside]{book}","\\documentclass[11pt,twoside]{book}","\\documentclass[12pt,twoside]{book}","\\documentclass[12pt,twoside]{article}"],"ok":2,"why":"book określa klasę książki, 12pt rozmiar tekstu, a twoside układ dwustronny."},{"q":"W jednym akapicie masz użyć kursywy, a nie pochylonej odmiany pisma. Które polecenie odpowiada instrukcji?","a":["\\textsl{fragment}","\\textit{fragment}","\\texttt{fragment}","\\textbf{fragment}"],"ok":1,"why":"\\textit wybiera kursywę, podczas gdy \\textsl to odrębna odmiana pisma pochylonego."},{"q":"Po kompilacji chcesz otrzymać elementy „1. Przygotuj plik” i „2. Skompiluj PDF”. Jakie środowisko należy zastosować?","a":["enumerate","itemize","description","tabular"],"ok":0,"why":"enumerate tworzy listę numerowaną; itemize odpowiada za wypunktowanie."},{"q":"W otoczeniu figure potrzebujesz numerowanego podpisu i etykiety fig:przyklad wskazującej ten rysunek. Która kolejność jest właściwa?","a":["\\label{fig:przyklad} → \\caption{Przykład}","\\ref{fig:przyklad} → \\caption{Przykład}","\\caption{Przykład} → \\ref{fig:przyklad}","\\caption{Przykład} → \\label{fig:przyklad}"],"ok":3,"why":"\\caption ustawia numer podpisu, a następujące po nim \\label zapisuje właściwy numer do późniejszych odwołań."},{"q":"W tabeli zapisano \\begin{tabular}{|c|c|c|}. Ile separatorów & i jaki znacznik końca wiersza zawiera prawidłowy wiersz z trzema komórkami?","a":["Jeden & oraz dwa ukośniki odwrotne.","Trzy & oraz dwa ukośniki odwrotne.","Dwa & oraz dwa ukośniki odwrotne.","Dwa & oraz pojedynczy ukośnik odwrotny."],"ok":2,"why":"Trzy kolumny rozdzielają dokładnie dwa &, a wiersz kończy para znaków \\\\."},{"q":"Dla wyróżnika Δ=b²−4ac zapisz rozwiązanie oznaczone x₁ zgodnie z instrukcją. Który fragment LaTeX jest poprawny?","a":["\\frac{-b+\\sqrt{\\Delta}}{2a}","\\frac{-b-\\sqrt{\\Delta}}{2a}","\\frac{-b-\\sqrt{\\Delta}}{a}","\\frac{-b-\\Delta}{2a}"],"ok":1,"why":"W instrukcji x₁=(-b-√Δ)/(2a); pierwiastek i mianownik muszą zostać zapisane oddzielnie."},{"q":"Wstawiłeś \\label{fig:przyklad} i \\ref{fig:przyklad}, a po pierwszym przebiegu PDFLaTeX odwołanie wyświetla „??”. Co należy zrobić?","a":["Ponownie skompilować dokument, aby odwołanie odczytało dane z pliku .aux.","Zamienić \\ref na \\cite, nie zmieniając etykiety.","Usunąć \\label, ponieważ podpis figure sam odtwarza odwołania.","Zastąpić polecenie \\ref poleceniem \\caption w tekście."],"ok":0,"why":"Odwołania krzyżowe zwykle wymagają kolejnego przebiegu kompilatora, który odczyta zapisane etykiety."},{"q":"W zwykłym tekście LaTeX wpisano „Wynik: 10% próbek”. Dlaczego część zdania może nie pojawić się w PDF?","a":["Znak % rozpoczyna nowy akapit.","Znak % zamienia tekst na tryb matematyczny.","Znak % wymusza przejście do następnej kolumny.","Znak % rozpoczyna komentarz; należy zapisać 10\\%."],"ok":3,"why":"W LaTeX znak % rozpoczyna komentarz do końca wiersza; zapis \\% powoduje wydrukowanie procenta."},{"q":"Wstawiasz po stronie tytułowej spis treści, spis rysunków i spis tabel, w tej kolejności. Który ciąg poleceń jest poprawny?","a":["\\listoftables → \\listoffigures → \\tableofcontents","\\tableofcontents → \\listoftables → \\listoffigures","\\tableofcontents → \\listoffigures → \\listoftables","\\listoffigures → \\tableofcontents → \\listoftables"],"ok":2,"why":"\\tableofcontents, \\listoffigures i \\listoftables generują kolejno odpowiednie spisy."},{"q":"W TikZ węzeł c znajduje się w (1.2,0.7). Dokąd prowadzi linia po \\draw[->] (c) -- ++(1,0);?","a":["Do punktu (1.0,0.0).","Do punktu (2.2,0.7).","Do punktu (1.2,1.7).","Do punktu (0.2,0.7)."],"ok":1,"why":"Współrzędne ++(1,0) oznaczają przesunięcie o 1 w prawo względem węzła c."}],"starter":{"wprowadzenie.tex":"\\documentclass[12pt,a4paper,twoside]{book}\n\\usepackage[T1]{fontenc}\n\\usepackage[utf8]{inputenc}\n\\usepackage[polish]{babel}\n\\usepackage{lmodern}\n\\usepackage{lipsum}\n\n\\title{Skład tekstu w praktyce}\n\\author{Student}\n\\date{\\today}\n\n\\begin{document}\n\\maketitle\n\\part{Podstawy składu}\n\\chapter{Pierwszy dokument}\n\\section{Wprowadzenie}\n\\subsection{Pierwszy akapit}\n\\lipsum[1]\n\n\\section{Krój pisma}\n\n\\section{Środowiska}\n\n\\section{Wzory matematyczne}\n\n\\section{Odwołania}\n\n\\section{Znaki specjalne}\n\n\\section{Rysunki w PGF/TikZ}\n\n\\end{document}\n"}};
const STEPS=CONFIG.steps;
const QUESTIONS=CONFIG.questions;
const STARTER=CONFIG.starter||{};
let current=0,completed=false,report=null;
const quizAnswers=Array(QUESTIONS.length).fill(null);
let quizAlbum='';
const $=id=>document.getElementById(id);
function esc(value){return String(value).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function commandSteps(items){
 return '<ol class="task-list">'+items.map(({label,code,detail,kind})=>
  '<li class="task '+(code?'':'text-only')+'"><div class="task-label">'+esc(label)+'</div>'+
  (code?'<pre><code>'+esc(code)+'</code></pre>':'<div class="details">'+(kind==='starter'?'<div class="starter-files" id="starterFiles"></div>':'')+'</div>')+
  (detail?'<div class="detail">'+esc(detail)+'</div>':'')+'</li>').join('')+'</ol>';
}
function btn(label,variant,fn){const x=document.createElement('button');x.type='button';x.className='btn '+variant;x.textContent=label;x.addEventListener('click',fn);return x;}
function downloadFile(filename,contents,mime){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.download=filename;a.href=url;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function show(n){
 if(completed && n!==STEPS.length+1)return;
 if(n<0||n>STEPS.length+1 || (n===STEPS.length+1&&!completed))return;
 current=n;
 const all=STEPS.map(s=>s.name).concat(['Test','Wyniki']);
 $('nav').replaceChildren();all.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className=i===n?'active':'';b.disabled=(completed&&i!==n)||(!completed&&i===STEPS.length+1);b.innerHTML='<span>'+String(i+1)+'</span>'+esc(name);b.setAttribute('aria-current',i===n?'step':'false');b.addEventListener('click',()=>show(i));$('nav').append(b);});
 $('progress').innerHTML=all.map((_,i)=>'<i class="'+(i<=n?'current':'')+'"></i>').join('');
 const c=$('content');
 if(n<STEPS.length){const s=STEPS[n];c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>'+esc(s.heading)+'</h2><p>'+s.intro+'</p>'+commandSteps(s.items)+(s.tail?'<div class="hint">'+s.tail+'</div>':'');
  const holder=$('starterFiles');if(holder){Object.entries(STARTER).forEach(([filename,contents])=>{const b=document.createElement('button');b.type='button';b.textContent=filename;b.addEventListener('click',()=>downloadFile(filename,contents,'text/plain;charset=utf-8'));holder.append(b);});}
 }else if(n===STEPS.length){c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Sprawdź wiedzę</h2><p>10 pytań, po cztery odpowiedzi. Wybierz po jednej. Wyniki zostaną pokazane po zakończeniu.</p><p class="album"><label for="album">Numer albumu (opcjonalnie): </label><input id="album" type="text" inputmode="numeric" maxlength="12" autocomplete="off"></p><form id="quiz" novalidate></form>';drawQuiz();$('album').value=quizAlbum;$('album').addEventListener('input',e=>quizAlbum=e.target.value);
 }else{c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Wynik podejścia</h2><div id="results"></div>';drawResults();}
 const a=$('actions');a.replaceChildren();if(n>0&&!completed)a.append(btn('Poprzedni','',()=>show(n-1)));
 if(n<STEPS.length)a.append(btn('Następny','primary',()=>show(n+1)));
 else if(n===STEPS.length&&!completed)a.append(btn('Zakończ i oceń','teal',grade));
 else if(n===STEPS.length+1)a.append(btn('Zapisz wynik JSON','primary',saveReport));
 window.scrollTo(0,0);
}
function drawQuiz(){const form=$('quiz');QUESTIONS.forEach((q,i)=>{
 const field=document.createElement('fieldset');field.className='question';const legend=document.createElement('legend');legend.innerHTML=String(i+1)+'. '+q.q;field.append(legend);
 const choices=document.createElement('div');choices.className='answer';q.a.forEach((answer,k)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=String(k);radio.autocomplete='off';radio.checked=quizAnswers[i]===k;radio.addEventListener('change',()=>quizAnswers[i]=k);label.append(radio,document.createTextNode(answer));choices.append(label);});field.append(choices);form.append(field);});}
function grade(){if(completed)return;
 const vals=quizAnswers.slice();
 const missing=vals.filter(x=>x===null).length;if(missing){alert('Odpowiedz na wszystkie pytania. Brak: '+missing+'.');return;}
 const album=$('album').value.trim();if(album&&!/^\d{1,12}$/.test(album)){alert('Numer albumu musi zawierać od 1 do 12 cyfr.');return;}
 const score=vals.reduce((n,a,i)=>n+Number(a===QUESTIONS[i].ok),0);
 report={schema:'ndp-lab-assessment/1.0',exercise:CONFIG.id,finished_at:new Date().toISOString(),album:album||null,score,max_score:10,percent:score*10,answers:vals.map((answer,i)=>({number:i+1,answer_index:answer,correct:answer===QUESTIONS[i].ok}))};
 completed=true;show(STEPS.length+1);
}
function drawResults(){if(!report)return;const r=$('results');r.innerHTML='<div class="kpis"><div class="kpi">Punkty<strong>'+report.score+' / 10</strong></div><div class="kpi">Wynik<strong>'+report.percent+'%</strong></div></div><p class="details">Poniżej podano ocenę odpowiedzi i poprawne rozwiązania.</p>';
 QUESTIONS.forEach((q,i)=>{const isCorrect=report.answers[i].correct;const b=document.createElement('div');b.className='result-item '+(isCorrect?'good':'');
 const h=document.createElement('strong');h.textContent=(i+1)+'. '+(isCorrect?'Poprawnie':'Błąd')+' · '+q.q.replace(/<[^>]*>/g,'');b.append(h);
 const v=document.createElement('p');v.textContent='Twoja odpowiedź: '+q.a[report.answers[i].answer_index];b.append(v);
 if(!isCorrect){const c=document.createElement('p');c.textContent='Poprawna odpowiedź: '+q.a[q.ok];b.append(c);}
 const why=document.createElement('p');why.className='details';why.textContent=q.why;b.append(why);r.append(b);});
 const p=document.createElement('p');p.className='details';p.textContent='Raport możesz zapisać na komputerze. Nie jest wysyłany automatycznie.';r.append(p);
}
function saveReport(){if(!report)return;downloadFile('ndp_lab_'+CONFIG.number+'_wynik_'+(report.album||'anonim')+'.json',JSON.stringify(report,null,2)+'\n','application/json;charset=utf-8');}
show(0);
</script>
</body>
</html>
