<body><header><h1>Narzędzia dla programistów · Laboratorium 06</h1><p>System kontroli wersji Git · Basic</p></header>
<div class="layout"><aside aria-label="Nawigacja"><h2>Przebieg ćwiczenia</h2><nav id="nav" class="nav"></nav></aside><main><div class="paper"><div id="progress" class="progress" aria-hidden="true"></div><section id="content" aria-live="polite"></section><div id="actions" class="actions"></div></div></main></div><footer>KIiA · Politechnika Rzeszowska</footer>
<script>
"use strict";
const STEPS=[["Start","Przygotowanie środowiska","Otwórz terminal Bash lub Git Bash. Wykonuj polecenia pojedynczo, w podanej kolejności.",[["Sprawdź zainstalowaną wersję Git.","git --version"]]],["Repozytorium","Utwórz repozytorium","Pracuj w katalogu ćwiczenia. Konfiguracja autora dotyczy wyłącznie tego repozytorium.",[["Utwórz katalog.","mkdir ndp-git-lab06"],["Przejdź do katalogu.","cd ndp-git-lab06"],["Zainicjalizuj repozytorium z gałęzią główną.","git init -b main"],["Ustaw nazwę autora.","git config user.name \"Student NDP\""],["Ustaw adres autora.","git config user.email \"student@example.invalid\""],["Sprawdź stan.","git status"]],"Na stanowisku współdzielonym nie zmieniaj globalnej konfiguracji Git za pomocą git config --global."],["Commit","Zapisz pierwsze zmiany","Utwórz plik, dodaj go do indeksu i zapisz zatwierdzenie.",[["Utwórz plik z jedną linią.","printf 'Pierwsza wersja projektu\\n' > notatki.txt"],["Sprawdź status nowego pliku.","git status"],["Przygotuj plik do zatwierdzenia.","git add notatki.txt"],["Sprawdź zawartość indeksu.","git diff --cached"],["Utwórz zatwierdzenie (commit).","git commit -m \"Dodaj notatki\""],["Wyświetl historię.","git log --oneline -3"]],"Porównaj git diff oraz git diff --cached po samodzielnej zmianie pliku."],["Gałęzie","Utwórz i scal gałąź","Zapisz zmianę w nowej gałęzi, po czym zintegruj ją z main.",[["Utwórz gałąź roboczą.","git switch -c funkcja-opis"],["Dopisz kolejną linię.","printf 'Druga wersja projektu\\n' >> notatki.txt"],["Przygotuj zmianę.","git add notatki.txt"],["Utwórz zatwierdzenie (commit).","git commit -m \"Rozszerz notatki\""],["Wróć na main.","git switch main"],["Scal zmiany.","git merge funkcja-opis"],["Wyświetl graf zatwierdzeń.","git log --oneline --graph --all -5"]],"Zwróć uwagę na scalenie typu fast-forward, które nie wymaga osobnego zatwierdzenia scalającego."],["Zdalne","Repozytorium zdalne na dysku","Repozytorium typu bare pełni funkcję lokalnego repozytorium zdalnego. Nie wymaga dostępu do internetu.",[["Utwórz repozytorium typu bare obok katalogu ćwiczenia.","git init --bare --initial-branch=main ../ndp-remote.git"],["Dodaj zdalne repozytorium origin.","git remote add origin ../ndp-remote.git"],["Sprawdź adres repozytorium zdalnego.","git remote -v"],["Wyślij gałąź main do repozytorium zdalnego.","git push -u origin main"],["Pobierz informacje o gałęziach z repozytorium origin.","git fetch origin"],["Sprawdź stan synchronizacji.","git status"]],"git fetch pobiera dane bez automatycznego scalania, a git pull dodatkowo integruje zmiany."],["Dodatkowe","Zadania dodatkowe","Wykonaj je przed zakończeniem ćwiczenia.",[["Utwórz nieśledzony plik.","printf 'Plik testowy\\n' > tymczasowy.txt"],["Wyświetl podgląd czyszczenia bez usuwania.","git clean -nd"],["Dopisz wpis, który następnie odwrócisz.","printf 'Wpis do cofnięcia\\n' >> notatki.txt"],["Przygotuj wpis.","git add notatki.txt"],["Zatwierdź wpis.","git commit -m \"Dodaj wpis tymczasowy\""],["Utwórz commit odwracający ostatnią zmianę.","git revert --no-edit HEAD"],["Sprawdź historię.","git log --oneline -3"]],"Nie używaj git reset --hard ani git clean -fd w projektach z cudzymi danymi."],["Zakończenie","Zakończ ćwiczenie","Zachowaj lokalne repozytorium i sprawdź wynik przed testem.",[["Sprawdź stan końcowy.","git status"],["Wyświetl skróconą historię zatwierdzeń.","git log --oneline --all -5"]],"Repozytoria ndp-git-lab06 i ndp-remote.git pozostaw we własnym katalogu roboczym. Na komputerze współdzielonym postępuj zgodnie z poleceniami prowadzącego."]], QUESTIONS=[["Po zatwierdzeniu notatki.txt dopisano nowy wiersz, ale nie wykonano git add. W której części git status pojawi się ten plik?",["Changes to be committed (zmiany przygotowane).","Changes not staged for commit (zmiany nieprzygotowane).","Untracked files (pliki nieśledzone).","Your branch is ahead of origin/main (nowy commit lokalny)."],1,"Plik jest śledzony, lecz nowe modyfikacje nie trafiły do indeksu; git status pokazuje je jako nieprzygotowane."],["Po wykonaniu git add notatki.txt uruchomiono git diff --cached. Między jakimi stanami porównywana jest zawartość?",["Indeksem a ostatnim zatwierdzeniem HEAD.","Katalogiem roboczym a indeksem.","Gałęzią main a gałęzią origin/main.","Bieżącym zatwierdzeniem a jego rodzicem."],0,"git diff --cached porównuje zmiany przygotowane w indeksie z HEAD, nie z katalogiem roboczym."],["W repozytorium zmodyfikowano śledzony plik notatki.txt, lecz nie wykonano git add. Co zwykle zrobi samo git commit -m \"Zmiana\"?",["Zapisze aktualny stan pliku wraz ze zmianami.","Automatycznie wykona git add i utworzy zatwierdzenie.","Utworzy puste zatwierdzenie zawierające tylko komunikat.","Nie zatwierdzi tych zmian, ponieważ nie dodano ich do indeksu."],3,"Zwykłe git commit bez opcji -a zatwierdza zawartość indeksu, a nie nieprzygotowane modyfikacje."],["Na gałęzi funkcja-opis powstał nowy commit, a main nadal wskazuje jej poprzednika. Co może zrobić git merge funkcja-opis uruchomione na main?",["Utworzyć zawsze osobny commit scalający z dwoma rodzicami.","Przenieść wyłącznie pliki nieśledzone, bez zmiany historii.","Przesunąć main do commita funkcji przez fast-forward, bez dodatkowego commita.","Usunąć commit gałęzi funkcja-opis po wykonaniu scalenia."],2,"Kiedy main jest przodkiem gałęzi funkcja-opis, scalenie może być fast-forward."],["W katalogu ndp-git-lab06 uruchomiono git init --bare --initial-branch=main ../ndp-remote.git. Co utworzono?",["Zwykłe repozytorium wewnątrz ndp-git-lab06/ndp-remote.git.","Repozytorium bare w sąsiednim katalogu ndp-remote.git, bez katalogu roboczego.","Gałąź o nazwie ndp-remote.git w bieżącym repozytorium.","Klon repozytorium origin w katalogu ndp-git-lab06."],1,"Ścieżka ../ oznacza katalog nadrzędny, a --bare tworzy repozytorium bez obszaru roboczego."],["Po ustawieniu origin wykonano git push -u origin main. Jaki dodatkowy skutek ma opcja -u przy poprawnym wysłaniu?",["Ustawia origin/main jako gałąź śledzoną przez lokalną main.","Tworzy lokalnie nową gałąź o nazwie origin.","Wysyła wszystkie gałęzie i tagi niezależnie od argumentów.","Zmienia domyślną nazwę gałęzi z main na master."],0,"-u/--set-upstream ustawia powiązanie upstream dla wysłanej gałęzi, ułatwiając kolejne push/pull."],["Po zmianach w repozytorium zdalnym wykonujesz tylko git fetch origin. Co powinno pozostać bez automatycznej zmiany?",["Referencje origin/* wskazujące na pobrane zatwierdzenia.","Obiekty commitów dostępne w lokalnej bazie Git.","Informacje o gałęziach po stronie origin.","Katalog roboczy i bieżąca gałąź lokalna."],3,"fetch pobiera dane i aktualizuje referencje zdalne, ale nie scala ich sam z bieżącą gałęzią."],["Utworzono nieśledzony plik tymczasowy.txt. Co zrobi git clean -nd?",["Usunie plik, lecz zachowa puste katalogi.","Przeniesie plik do indeksu Git bez zatwierdzania.","Wyświetli pliki przewidziane do usunięcia, ale ich nie usunie.","Przywróci ostatnią zatwierdzoną wersję tego pliku."],2,"-n oznacza podgląd (dry-run), a -d obejmuje również nieśledzone katalogi."],["Po zatwierdzeniu niechcianego dopisku do notatki.txt wykonano git revert --no-edit HEAD. Jak zmieni się historia?",["Ostatni commit zostanie bezpowrotnie usunięty z historii.","Powstanie nowy commit odwracający skutki ostatniego, z zachowaniem poprzedniego w historii.","Wszystkie wcześniejsze commity zostaną scalone w jeden.","Historia nie zmieni się, a usunięte zostaną tylko pliki nieśledzone."],1,"revert dodaje nowe zatwierdzenie z odwrotną zmianą zamiast usuwać istniejące zatwierdzenia."],["W katalogu repozytorium wykonano git config user.name \"Student NDP\" bez --global. Gdzie zostanie zapisane to ustawienie?",["W konfiguracji lokalnej bieżącego repozytorium.","W globalnej konfiguracji wszystkich repozytoriów użytkownika.","W pliku konfiguracyjnym repozytorium origin.","W zmiennej środowiskowej tylko do zakończenia powłoki."],0,"Bez --global git config w repozytorium zapisuje ustawienia lokalnie, zwykle w .git/config."]];
let current=0,completed=false,report=null,album="";const answers=Array(QUESTIONS.length).fill(null),$=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function btn(name,callback,primary=false){const b=document.createElement('button');b.type='button';b.className='btn'+(primary?' primary':'');b.textContent=name;b.addEventListener('click',callback);return b;}
function show(n){
 if(completed&&n!==STEPS.length+1)return;
 if(n<0||n>STEPS.length+1||(!completed&&n===STEPS.length+1))return;
 current=n;const names=STEPS.map(s=>s[0]).concat(['Test','Wyniki']);
 $('nav').replaceChildren();names.forEach((name,i)=>{const b=btn((i+1)+'. '+name,()=>show(i));b.className=i===n?'active':'';b.disabled=(completed&&i!==n)||(!completed&&i===STEPS.length+1);$('nav').append(b);});
 $('progress').innerHTML=names.map((_,i)=>'<i class="'+(i<=n?'current':'')+'"></i>').join('');
 const c=$('content');
 if(n<STEPS.length){const s=STEPS[n];c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+names.length+'</div><h2>'+esc(s[1])+'</h2><p>'+esc(s[2])+'</p><ol class="task-list">'+s[3].map(t=>'<li class="task"><div class="task-label">'+esc(t[0])+'</div><pre><code>'+esc(t[1])+'</code></pre></li>').join('')+'</ol>'+(s[4]?'<div class="hint">'+esc(s[4])+'</div>':'');}
 else if(n===STEPS.length){c.innerHTML='<h2>Sprawdź wiedzę</h2><p>10 pytań z czterema wariantami odpowiedzi. Wybierz jedną odpowiedź na każde pytanie.</p><p class="album"><label for="album">Numer albumu (opcjonalnie): </label><input id="album" inputmode="numeric" maxlength="12" autocomplete="off"></p><div id="quiz"></div>'; $('album').value=album;$('album').addEventListener('input',e=>album=e.target.value);QUESTIONS.forEach((q,i)=>{const f=document.createElement('fieldset');f.className='question';const l=document.createElement('legend');l.textContent=(i+1)+'. '+q[0];f.append(l);const a=document.createElement('div');a.className='answer';q[1].forEach((choice,k)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=answers[i]===k;input.addEventListener('change',()=>answers[i]=k);label.append(input,document.createTextNode(choice));a.append(label)});f.append(a);$('quiz').append(f)});}
 else{c.innerHTML='<h2>Wynik podejścia</h2><p><strong>'+report.score+' / 10 punktów ('+report.percent+'%)</strong></p><div id="results"></div>';QUESTIONS.forEach((q,i)=>{const ok=report.answers[i].correct;const d=document.createElement('div');d.className='result-item'+(ok?' good':'');d.textContent=(i+1)+'. '+q[0]+' — '+(ok?'Poprawnie':'Błąd')+'. Twoja odpowiedź: '+q[1][answers[i]]+'. '+(ok?'':'Poprawna: '+q[1][q[2]]+'. ')+q[3];$('results').append(d)});}
 const a=$('actions');a.replaceChildren();if(n>0&&!completed)a.append(btn('Poprzedni',()=>show(n-1)));if(n<STEPS.length)a.append(btn('Następny',()=>show(n+1),true));else if(n===STEPS.length&&!completed)a.append(btn('Zakończ i oceń',grade,true));else if(completed)a.append(btn('Zapisz wynik JSON',saveReport,true));
}
function grade(){const missing=answers.filter(x=>x===null).length;if(missing){alert('Odpowiedz na wszystkie pytania. Brak: '+missing+'.');return;}if(album&&!/^\d{1,12}$/.test(album)){alert('Numer albumu musi zawierać od 1 do 12 cyfr.');return;}const score=answers.reduce((v,a,i)=>v+Number(a===QUESTIONS[i][2]),0);report={schema:'ndp-lab-assessment/1.0',exercise:'NDP-06',finished_at:new Date().toISOString(),album:album||null,score,max_score:10,percent:score*10,answers:answers.map((answer,i)=>({number:i+1,answer_index:answer,correct:answer===QUESTIONS[i][2]}))};completed=true;show(STEPS.length+1);}
function saveReport(){const blob=new Blob([JSON.stringify(report,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ndp_lab_06_wynik_'+(report.album||'anonim')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
show(0);
</script></body></html>
