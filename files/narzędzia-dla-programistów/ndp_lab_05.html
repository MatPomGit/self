"use strict";
const CONFIG={"id":"NDP-05","number":"05","title":"Pakiety LaTeX i własne makra","steps":[{"name":"Start","heading":"Otwórz dokument","intro":"Zapisz pliki startowe do <strong>jednego katalogu<\/strong>. Otwórz <code>wprowadzenie.tex<\/code> w VS Code lub innym edytorze LaTeX.","items":[{"label":"Pobierz komplet plików, korzystając z przycisków poniżej.","code":null,"detail":null,"kind":"starter"},{"label":"Przejdź w terminalu do katalogu z plikami.","code":null,"detail":"Otwórz terminal w katalogu, w którym znajduje się wprowadzenie.tex.","kind":"text"},{"label":"Wykonaj pierwszą kompilację.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Pliki startowe to uproszczony, kompletny przykład do tego ćwiczenia. Pracuj w kopii, nie modyfikuj plików innych studentów."},{"name":"Podpisy","heading":"Podpisy rysunków i tabel","intro":"Wstawiaj deklaracje w preambule, czyli <strong>przed <code>\\begin{document}<\/code><\/strong>. Po każdej zmianie skompiluj dokument.","items":[{"label":"Włącz pakiet caption.","code":"\\usepackage{caption}","detail":null,"kind":"code"},{"label":"Ustaw polskie podpisy rysunków.","code":"\\captionsetup[figure]{name=Rys.,labelsep=period,font=small,position=bottom,skip=3pt}","detail":"Oczekiwany format: Rys. 1.1. Tytuł rysunku.","kind":"code"},{"label":"Ustaw podpisy tabel nad tabelą.","code":"\\captionsetup[table]{name=Tab.,labelsep=period,font=small,position=top,skip=3pt}","detail":"Oczekiwany format: Tab. 1.1. Tytuł tabeli.","kind":"code"},{"label":"Zbuduj i obejrzyj PDF.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Nie dodawaj końcowej kropki do treści podpisu, jeśli pełni funkcję tytułu."},{"name":"Makra","heading":"Numeracja i własne polecenia","intro":"Uzupełnij preambułę dokumentu. Po wstawieniu nowych poleceń wywołaj je we właściwej sekcji.","items":[{"label":"Dodaj kropki do numerów sekcji.","code":"\\renewcommand{\\thesection}{\\arabic{chapter}.\\arabic{section}.}","detail":null,"kind":"code"},{"label":"Dodaj kropki do numerów podsekcji.","code":"\\renewcommand{\\thesubsection}{\\arabic{chapter}.\\arabic{section}.\\arabic{subsection}.}","detail":null,"kind":"code"},{"label":"Zmień numerowanie równań.","code":"\\renewcommand{\\theequation}{\\arabic{chapter}.\\arabic{equation}}","detail":null,"kind":"code"},{"label":"Zdefiniuj własne makro kod.","code":"\\newcommand{\\kod}[1]{\\texttt{#1}}","detail":null,"kind":"code"},{"label":"W sekcji Listingi użyj makra.","code":"W języku C funkcja \\kod{main} jest punktem wejścia.","detail":null,"kind":"code"},{"label":"Przebuduj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Makro powinno zmieniać styl wyłącznie tekstu przekazanego w argumencie."},{"name":"Listy i wzory","heading":"Listy oraz równania","intro":"Pakiety <code>enumitem<\/code> i <code>amsmath<\/code> dodaj w preambule.","items":[{"label":"Dodaj pakiet enumitem.","code":"\\usepackage{enumitem}","detail":null,"kind":"code"},{"label":"Globalnie ustaw znak wypunktowania i odstępy.","code":"\\setlist[itemize]{label=---,noitemsep,topsep=0pt}","detail":null,"kind":"code"},{"label":"W sekcji Środowiska dodaj listę o własnym symbolu.","code":"\\begin{itemize}[label=*,leftmargin=2.25\\parindent]","detail":null,"kind":"code"},{"label":"Wstaw jeden element nowej listy.","code":"\\item Pozycja lokalnej listy","detail":null,"kind":"code"},{"label":"Zakończ listę.","code":"\\end{itemize}","detail":null,"kind":"code"},{"label":"Dodaj pakiet amsmath.","code":"\\usepackage{amsmath}","detail":null,"kind":"code"},{"label":"W sekcji Wzory zdefiniuj układ równań.","code":"\\begin{equation}\\label{eq:uklad}\\begin{aligned} y &= 2x-2 \\\\ x &= -3y+2 \\end{aligned}\\end{equation}","detail":null,"kind":"code"},{"label":"Dodaj odwołanie do wzoru.","code":"Zobacz równanie \\eqref{eq:uklad}.","detail":null,"kind":"code"},{"label":"Sprawdź wynik kompilacji.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Dostosowanie listy w nawiasach kwadratowych działa lokalnie. <code>\\eqref<\/code> dodaje nawiasy automatycznie."},{"name":"Kolory i kod","heading":"Kolory, listingi C i metadane","intro":"Zmiany preambuły wykonaj przed wstawieniem tekstu do dokumentu.","items":[{"label":"Włącz kolory.","code":"\\usepackage{xcolor}","detail":null,"kind":"code"},{"label":"Zdefiniuj kolor wydziałowy.","code":"\\definecolor{wydzialowy}{RGB}{75,160,165}","detail":null,"kind":"code"},{"label":"Wstaw kolorowany tekst.","code":"\\textcolor{wydzialowy}{Przykład tekstu wydziałowego.}","detail":null,"kind":"code"},{"label":"Włącz obsługę listingów UTF-8.","code":"\\usepackage[final]{listingsutf8}","detail":null,"kind":"code"},{"label":"Skonfiguruj podstawowe opcje listingów.","code":"\\lstset{language={[ANSI]C},numbers=left,stepnumber=1,basicstyle=\\ttfamily\\small,frame=single,showspaces=false,showtabs=false,showstringspaces=false,keywordstyle=\\color{blue},stringstyle=\\color{olive},commentstyle=\\color{green}}","detail":null,"kind":"code"},{"label":"W sekcji Listingi dołącz plik zrodlo.c.","code":"\\lstinputlisting[language={[ANSI]C},inputencoding=utf8/cp1250]{zrodlo.c}","detail":"Plik źródłowy zrodlo.c powinien być zapisany w UTF-8.","kind":"code"},{"label":"Zamień w zrodlo.c Hello world na Witaj świecie.","code":null,"detail":"Zapisz plik z kodowaniem UTF-8, a następnie ponownie kompiluj dokument.","kind":"text"},{"label":"Dodaj pakiet do załączników.","code":"\\usepackage{embedfile}","detail":null,"kind":"code"},{"label":"Dodaj pakiet hyperref na końcu preambuły.","code":"\\usepackage{hyperref}","detail":null,"kind":"code"},{"label":"Ustaw metadane PDF.","code":"\\hypersetup{pdftitle={Ćwiczenie 5},pdfauthor={Student},pdfsubject={Pakiety i makra},pdfkeywords={LaTeX,makra}}","detail":null,"kind":"code"},{"label":"Za listingiem dołącz jego źródło.","code":"\\embedfile{zrodlo.c}","detail":null,"kind":"code"},{"label":"Zbuduj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Możliwość wyodrębnienia załącznika zależy od czytnika PDF."},{"name":"Bibliografia","heading":"Bibliografia BibTeX","intro":"Użyj pliku <code>zbior.bib<\/code> z pakietu startowego. Nie usuwaj etykiet i kluczy cytowań.","items":[{"label":"W treści rozdziału Bibliografia dodaj cytowanie.","code":"Przykładowa publikacja \\cite{Przyklad}.","detail":null,"kind":"code"},{"label":"Przed końcem dokumentu dodaj styl cytowania.","code":"\\bibliographystyle{plain}","detail":null,"kind":"code"},{"label":"W kolejnym wierszu wstaw bazę bibliograficzną.","code":"\\bibliography{zbior}","detail":null,"kind":"code"},{"label":"Pierwszy przebieg LaTeX.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Wygeneruj bibliografię.","code":"bibtex wprowadzenie","detail":null,"kind":"code"},{"label":"Powtórz LaTeX, aby ustalić odwołania.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Ostatecznie rozwiąż referencje.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Dodaj własny wpis w zbior.bib.","code":null,"detail":"Zastosuj unikalny klucz i właściwe pola, np. author, title, year. Zacytuj nowy wpis.","kind":"text"},{"label":"Zmień styl na alpha, po czym ponów kompilację BibTeX.","code":"\\bibliographystyle{alpha}","detail":null,"kind":"code"}],"tail":"Po zmianie stylu bibliografii wykonaj ponownie sekwencję LaTeX → BibTeX → LaTeX → LaTeX."},{"name":"Dodatkowe","heading":"Zadania dodatkowe","intro":"Prace rozszerzone wykonaj przed zakończeniem ćwiczenia.","items":[{"label":"W preambule dodaj pakiet circuitikz.","code":"\\usepackage[smartlabels,european]{circuitikz}","detail":null,"kind":"code"},{"label":"Zacznij środowisko rysunku.","code":"\\begin{figure}[htbp]","detail":null,"kind":"code"},{"label":"Wycentruj schemat.","code":"\\centering","detail":null,"kind":"code"},{"label":"Rozpocznij circuitikz.","code":"\\begin{circuitikz}","detail":null,"kind":"code"},{"label":"Dodaj szeregowy obwód ze źródłem, rezystorem i diodą.","code":"\\draw (0,0) to[battery,l=$V_s$] (0,2) to[R,l=$R_1$] (3,2) to[D,l=$D_1$] (3,0) -- (0,0);","detail":null,"kind":"code"},{"label":"Zakończ circuitikz.","code":"\\end{circuitikz}","detail":null,"kind":"code"},{"label":"Podpisz rysunek.","code":"\\caption{Przykładowy obwód elektroniczny}","detail":null,"kind":"code"},{"label":"Zakończ rysunek.","code":"\\end{figure}","detail":null,"kind":"code"},{"label":"Rozszerz własny schemat o diodę D2 i kondensator C2.","code":null,"detail":"Zwróć uwagę na polaryzację diody i ciągłość połączeń.","kind":"text"},{"label":"Utwórz graf według wzorca od prowadzącego.","code":null,"detail":"Zbuduj go w TikZ lub circuitikz i skompiluj PDF.","kind":"text"}],"tail":"Po zakończeniu zachowaj wynik PDF, pliki źródłowe oraz bazę bibliograficzną."},{"name":"Zakończenie","heading":"Zakończ ćwiczenie","intro":"Zachowaj wynik PDF i komplet źródeł LaTeX. Zweryfikuj ostatnią kompilację.","items":[{"label":"Wykonaj ostatnią kompilację.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Sprawdź plik wyjściowy.","code":null,"detail":"Otwórz wprowadzenie.pdf, przejrzyj podpisy, listy, listing kodu oraz bibliografię.","kind":"text"},{"label":"Zarchiwizuj swoją pracę.","code":null,"detail":"Zachowaj pliki .tex, .c, .bib i PDF. Wspólne stanowisko pozostaw bez swoich danych.","kind":"text"}],"tail":null}],"questions":[{"q":"Który pakiet służy do zmiany wyglądu podpisów rysunków i tabel?","a":["geometry","caption","amsmath","graphicx"],"ok":1,"why":"Pakiet caption umożliwia m.in. zmianę etykiety, separatora i położenia podpisu."},{"q":"Jak w LaTeX zdefiniować makro przyjmujące jeden argument?","a":["\\newcommand{\\kod}[1]{\\texttt{#1}}","\\defmacro{\\kod}=\\texttt","\\include{\\kod}[1]","\\usepackage{\\kod}{1}"],"ok":0,"why":"newcommand z oznaczeniem [1] definiuje argument dostępny jako #1."},{"q":"Co określa opcja <code>label=*<\/code> w środowisku itemize z enumitem?","a":["Wyrównanie wszystkich równań","Liczbę elementów listy","Znak znacznika listy","Kolejność cytowań"],"ok":2,"why":"enumitem pozwala zmieniać wygląd znaczników list globalnie i lokalnie."},{"q":"Który pakiet udostępnia środowisko <code>aligned<\/code>?","a":["xcolor","hyperref","embedfile","amsmath"],"ok":3,"why":"Środowisko aligned pochodzi z amsmath."},{"q":"Czego używa się do odwołania do równania wraz z nawiasami?","a":["\\label{eq:wzor}","\\eqref{eq:wzor}","\\caption{eq:wzor}","\\usepackage{eq:wzor}"],"ok":1,"why":"eqref z amsmath dodaje nawiasy wokół numeru równania."},{"q":"Jak definiuje się własny kolor w modelu RGB?","a":["\\textbf{RGB}","\\setcolor{RGB}","\\definecolor{wydzialowy}{RGB}{75,160,165}","\\rgb{75,160,165}"],"ok":2,"why":"xcolor udostępnia definecolor z modelem RGB i wartościami 0–255."},{"q":"Które polecenie wczytuje listing kodu z pliku?","a":["\\lstinputlisting{zrodlo.c}","\\inputlisting{zrodlo.c}","\\begin{code}{zrodlo.c}","\\embedfile{listing}"],"ok":0,"why":"lstinputlisting służy do wyświetlenia kodu w dokumencie."},{"q":"Który pakiet pozwala definiować metadane i odnośniki PDF?","a":["enumitem","caption","circuitikz","hyperref"],"ok":3,"why":"hyperref i hypersetup konfigurują m.in. tytuł i autora PDF."},{"q":"Jak dołączyć plik źródłowy jako załącznik do PDF?","a":["\\cite{zrodlo.c}","\\embedfile{zrodlo.c}","\\lstset{zrodlo.c}","\\bibliography{zrodlo.c}"],"ok":1,"why":"embedfile dołącza rzeczywisty plik; lstinputlisting wyświetla jego tekst."},{"q":"Jaka jest właściwa kolejność kompilacji z BibTeX?","a":["BibTeX → PDFLaTeX","PDFLaTeX → PDFLaTeX → BibTeX","PDFLaTeX → BibTeX → PDFLaTeX → PDFLaTeX","PDFLaTeX → BibTeX bez kolejnych przebiegów"],"ok":2,"why":"Najpierw powstaje plik aux, następnie BibTeX przetwarza cytowania, a dwa przebiegi LaTeX rozwiązują odwołania."}],"starter":{"wprowadzenie.tex":"\\documentclass[11pt,a4paper]{report}\n\\usepackage[T1]{fontenc}\n\\usepackage[utf8]{inputenc}\n\\usepackage[polish]{babel}\n\\usepackage{lmodern}\n\\usepackage{graphicx}\n\\title{Pakiety i makra LaTeX}\n\\author{Student}\n\\date{\\today}\n\\begin{document}\n\\maketitle\n\\tableofcontents\n\\listoffigures\n\\chapter{Podstawy}\n\\section{Środowiska}\n\\begin{itemize}\n  \\item Pierwszy element\n  \\item Drugi element\n\\end{itemize}\n\\subsection{Przykład podsekcji}\n\\begin{figure}[htbp]\n  \\centering\n  \\fbox{\\Large\\LaTeX}\n  \\caption{Logo projektu LaTeX}\n\\end{figure}\n\\begin{table}[htbp]\n  \\caption{Przykładowa tabela}\n  \\centering\n  \\begin{tabular}{|l|r|}\\hline\n    A & 1\\\\ \\hline\n    B & 2\\\\ \\hline\n  \\end{tabular}\n\\end{table}\n\\chapter{Zastosowania}\n\\section{Listingi}\nW tym miejscu dodasz listing pliku C.\n\\section{Wzory}\n\\begin{equation}\\label{eq:wzor}\n  x = 1\n\\end{equation}\n\\chapter{Bibliografia}\nW tym miejscu dodasz cytowania.\n\\end{document}\n","zrodlo.c":"#include <stdio.h>\nint main(void) {\n    puts(\"Hello world\");\n    return 0;\n}\n","zbior.bib":"@book{Przyklad,\n  author = {Nowak, Jan},\n  title = {Przykładowa publikacja do ćwiczenia},\n  year = {2020},\n  publisher = {Wydawnictwo przykładowe}\n}\n","fragmenty.tex":"% Pomocniczy plik z przykładami poleceń do ćwiczenia 5.\n% Przenieś potrzebne fragmenty do wprowadzenie.tex.\n% \\usepackage{caption}\n% \\usepackage{enumitem}\n% \\usepackage{amsmath}\n% \\usepackage{xcolor}\n% \\usepackage{listingsutf8}\n% \\usepackage{hyperref}\n% \\usepackage{embedfile}\n"}};

function esc(value){return String(value).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function commandSteps(items){
 return '<ol class="task-list">'+items.map(({label,code,detail,kind})=>

}
function btn(label,variant,fn){const x=document.createElement('button');x.type='button';x.className='btn '+variant;x.textContent=label;x.addEventListener('click',fn);return x;}
function downloadFile(filename,contents,mime){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.download=filename;a.href=url;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function show(n){
 if(completed && n!==STEPS.length+1)return;
 if(n<0||n>STEPS.length+1 || (n===STEPS.length+1&&!completed))return;
 current=n;
 const all=STEPS.map(s=>s.name).concat(['Test','Wyniki']);
 $('nav').replaceChildren();all.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className=i===n?'active':'';b.disabled=(completed&&i!==n)||(!completed&&i===STEPS.length+1);b.innerHTML='<span>'+String(i+1)+'</span>'+esc(name);b.setAttribute('aria-current',i===n?'step':'false');b.addEventListener('click',()=>show(i));$('nav').append(b);});
 $('progress').innerHTML=all.map((_,i)=>'<i class="'+(i<=n?'current':'')+'"></i>').join('');
 const c=$('content');
 if(n<STEPS.length){const s=STEPS[n];c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>'+esc(s.heading)+'</h2><p>'+s.intro+'</p>'+commandSteps(s.items)+(s.tail?'<div class="hint">'+s.tail+'</div>':'');
  const holder=$('starterFiles');if(holder){Object.entries(STARTER).forEach(([filename,contents])=>{const b=document.createElement('button');b.type='button';b.textContent=filename;b.addEventListener('click',()=>downloadFile(filename,contents,'text/plain;charset=utf-8'));holder.append(b);});}
 }else if(n===STEPS.length){c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Sprawdź wiedzę</h2><p>10 pytań, po cztery odpowiedzi. Wybierz po jednej. Wyniki zostaną pokazane po zakończeniu.</p><p class="album"><label for="album">Numer albumu (opcjonalnie): </label><input id="album" type="text" inputmode="numeric" maxlength="12" autocomplete="off"></p><form id="quiz" novalidate></form>';drawQuiz();$('album').value=quizAlbum;$('album').addEventListener('input',e=>quizAlbum=e.target.value);
 }else{c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Wynik podejścia</h2><div id="results"></div>';drawResults();}
 const a=$('actions');a.replaceChildren();if(n>0&&!completed)a.append(btn('Poprzedni','',()=>show(n-1)));
 if(n<STEPS.length)a.append(btn('Następny','primary',()=>show(n+1)));
 else if(n===STEPS.length&&!completed)a.append(btn('Zakończ i oceń','teal',grade));
 else if(n===STEPS.length+1)a.append(btn('Zapisz wynik JSON','primary',saveReport));
 window.scrollTo(0,0);
}
function drawQuiz(){const form=$('quiz');QUESTIONS.forEach((q,i)=>{
 const field=document.createElement('fieldset');field.className='question';const legend=document.createElement('legend');legend.innerHTML=String(i+1)+'. '+q.q;field.append(legend);
 const choices=document.createElement('div');choices.className='answer';q.a.forEach((answer,k)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=String(k);radio.autocomplete='off';radio.checked=quizAnswers[i]===k;radio.addEventListener('change',()=>quizAnswers[i]=k);label.append(radio,document.createTextNode(answer));choices.append(label);});field.append(choices);form.append(field);});}
function grade(){if(completed)return;
 const vals=quizAnswers.slice();
 const missing=vals.filter(x=>x===null).length;if(missing){alert('Odpowiedz na wszystkie pytania. Brak: '+missing+'.');return;}
 const album=$('album').value.trim();if(album&&!/^\d{1,12}$/.test(album)){alert('Numer albumu musi zawierać od 1 do 12 cyfr.');return;}
 const score=vals.reduce((n,a,i)=>n+Number(a===QUESTIONS[i].ok),0);
 report={schema:'ndp-lab-assessment/1.0',exercise:CONFIG.id,finished_at:new Date().toISOString(),album:album||null,score,max_score:10,percent:score*10,answers:vals.map((answer,i)=>({number:i+1,answer_index:answer,correct:answer===QUESTIONS[i].ok}))};
 completed=true;show(STEPS.length+1);
}
function drawResults(){if(!report)return;const r=$('results');r.innerHTML='<div class="kpis"><div class="kpi">Punkty<strong>'+report.score+' / 10</strong></div><div class="kpi">Wynik<strong>'+report.percent+'%</strong></div></div><p class="details">Poniżej podano ocenę odpowiedzi i poprawne rozwiązania</p>';
 QUESTIONS.forEach((q,i)=>{const isCorrect=report.answers[i].correct;const b=document.createElement('div');b.className='result-item '+(isCorrect?'good':'');
 const h=document.createElement('strong');h.textContent=(i+1)+'. '+(isCorrect?'Poprawnie':'Błąd')+' · '+q.q.replace(/<[^>]*>/g,'');b.append(h);
 const v=document.createElement('p');v.textContent='Twoja odpowiedź: '+q.a[report.answers[i].answer_index];b.append(v);
 if(!isCorrect){const c=document.createElement('p');c.textContent='Poprawna odpowiedź: '+q.a[q.ok];b.append(c);}
 const why=document.createElement('p');why.className='details';why.textContent=q.why;b.append(why);r.append(b);});
}
function saveReport(){if(!report)return;downloadFile('ndp_lab_'+CONFIG.number+'_wynik_'+(report.album||'anonim')+'.json',JSON.stringify(report,null,2)+'\n','application/json;charset=utf-8');}
show(0);
</script>
</body>
</html>
