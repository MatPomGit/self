<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172c40;background:#f2f5f8;line-height:1.42}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}

main{min-width:0}.paper{background:white;border:1px solid #d8e2eb;border-radius:10px;padding:17px 22px 20px;min-height:375px}
.section-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.step-count{color:#087e8b;font-size:.76rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.32rem;line-height:1.2;margin:5px 0 9px}p{margin:8px 0}.muted{color:#475c70;font-size:.89rem}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}p code,li code{background:#eaf0f5;color:#142638;border-radius:3px;padding:1px 4px}
.task-list{margin:9px 0 0;padding:0;list-style:none;counter-reset:task;display:grid;gap:5px}.task{counter-increment:task;display:grid;grid-template-columns:minmax(170px,.87fr) minmax(0,1.5fr);align-items:start;gap:12px;padding:8px 10px;border:1px solid #e0e8ef;border-radius:7px;background:#fcfdff}

.task pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf1f7;color:#0d283e!important;padding:8px 11px;border:1px solid #cbdce9;border-radius:5px;font-size:.9rem;line-height:1.37;tab-size:2;user-select:text}
.task pre code{color:#0d283e!important;background:transparent!important;font-size:inherit!important;white-space:inherit}
.task .detail{grid-column:2;font-size:.79rem;color:#42596c;margin-top:-5px}.task.text-only .detail{grid-column:2;margin-top:2px}
.hint{font-size:.86rem;color:#425568;border-left:3px solid #087e8b;background:#f2f8fa;padding:8px 11px;margin-top:12px}
.progress{height:4px;display:flex;gap:4px;margin-bottom:13px}.progress i{border-radius:5px;background:#e0e8ef;flex:1}.progress .current{background:#087e8b}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #e6edf2;margin-top:16px;padding-top:14px}
.btn{font-size:.88rem;font-weight:700;padding:8px 15px;border-radius:6px;border:1px solid #c2d2df;color:#003c82;background:white}.btn.primary{background:#003c82;border-color:#003c82;color:white}.btn.teal{background:#087e8b;border-color:#087e8b;color:white}
.starter-files{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}.starter-files button{border:1px solid #abc1d2;background:#eaf4f8;color:#003c82;border-radius:6px;font-size:.8rem;padding:5px 9px}
.question{margin:7px 0;padding:10px 12px 11px;border:1px solid #dde7ef;border-radius:7px;min-width:0}.question legend{font-weight:680;font-size:.93rem;padding:0 4px}
.answer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.answer label{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid #dce5ec;border-radius:5px;font-size:.85rem;cursor:pointer;line-height:1.3}
.answer label:has(input:checked){border-color:#087e8b;background:#ecf8f7}.answer input{flex-shrink:0;accent-color:#087e8b;margin-top:3px}
.details{font-size:.84rem;color:#495c6a}.album{margin:12px 0}.album input{max-width:160px;border:1px solid #c1d0db;border-radius:5px;padding:6px}
.kpis{display:flex;gap:9px;margin:11px 0}.kpi{border:1px solid #cddde6;border-radius:7px;padding:10px 15px;background:#f4f9fb}.kpi strong{display:block;font-size:1.35rem;color:#003c82}
.result-item{margin:7px 0;padding:10px 12px;border:1px solid #dde6ed;border-left:4px solid #b45539;border-radius:5px;font-size:.87rem}.result-item.good{border-left-color:#178055}.result-item p{margin:3px 0}
footer{max-width:1220px;margin:0 auto 24px;padding:0 15px;color:#687a88;font-size:.77rem;text-align:right}
@media(max-width:880px){.layout{grid-template-columns:1fr}.nav{display:flex;flex-wrap:wrap}.nav button{flex:1;min-width:95px;justify-content:center}.nav span{display:none}aside{position:static}}
@media(max-width:650px){header{padding:12px}.paper{padding:13px}.task{grid-template-columns:1fr;gap:5px;padding:9px}.task .detail{grid-column:1;margin-top:0}.task-label{padding-top:0}.answer{grid-template-columns:1fr}}
@media print{body{background:white}header{background:white;color:black;border-bottom:1px solid #ccc}.layout{display:block;margin:0}aside,.actions,.progress{display:none!important}.paper{border:0;padding:0}.task{break-inside:avoid}}

"use strict";
const CONFIG={"id":"NDP-05","number":"05","title":"Pakiety LaTeX i własne makra","steps":[{"name":"Start","heading":"Otwórz dokument","intro":"Zapisz pliki startowe w <strong>jednym katalogu</strong>. Otwórz <code>wprowadzenie.tex</code> w VS Code lub innym edytorze LaTeX.","items":[{"label":"Pobierz komplet plików, korzystając z przycisków poniżej.","code":null,"detail":null,"kind":"starter"},{"label":"Przejdź w terminalu do katalogu z plikami.","code":null,"detail":"Otwórz terminal w katalogu, w którym znajduje się wprowadzenie.tex.","kind":"text"},{"label":"Wykonaj pierwszą kompilację.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Pliki startowe tworzą uproszczony, kompletny przykład do tego ćwiczenia. Pracuj w kopii, nie modyfikuj plików innych studentów."},{"name":"Podpisy","heading":"Podpisy rysunków i tabel","intro":"Wstawiaj deklaracje w preambule, czyli <strong>przed <code>\\begin{document}</code></strong>. Po każdej zmianie skompiluj dokument.","items":[{"label":"Włącz pakiet caption.","code":"\\usepackage{caption}","detail":null,"kind":"code"},{"label":"Ustaw polskie podpisy rysunków.","code":"\\captionsetup[figure]{name=Rys.,labelsep=period,font=small,position=bottom,skip=3pt}","detail":"Oczekiwany format: Rys. 1.1. Tytuł rysunku.","kind":"code"},{"label":"Ustaw podpisy tabel nad tabelą.","code":"\\captionsetup[table]{name=Tab.,labelsep=period,font=small,position=top,skip=3pt}","detail":"Oczekiwany format: Tab. 1.1. Tytuł tabeli.","kind":"code"},{"label":"Zbuduj i obejrzyj PDF.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Nie dodawaj końcowej kropki do treści podpisu, jeśli pełni funkcję tytułu."},{"name":"Makra","heading":"Numeracja i własne polecenia","intro":"Uzupełnij preambułę dokumentu. Po wstawieniu nowych poleceń wywołaj je we właściwej sekcji.","items":[{"label":"Dodaj kropki po numerach sekcji.","code":"\\renewcommand{\\thesection}{\\arabic{chapter}.\\arabic{section}.}","detail":null,"kind":"code"},{"label":"Dodaj kropki po numerach podsekcji.","code":"\\renewcommand{\\thesubsection}{\\arabic{chapter}.\\arabic{section}.\\arabic{subsection}.}","detail":null,"kind":"code"},{"label":"Zmień numerowanie równań.","code":"\\renewcommand{\\theequation}{\\arabic{chapter}.\\arabic{equation}}","detail":null,"kind":"code"},{"label":"Zdefiniuj własne makro kod.","code":"\\newcommand{\\kod}[1]{\\texttt{#1}}","detail":null,"kind":"code"},{"label":"Użyj makra w sekcji Listingi.","code":"W języku C funkcja \\kod{main} jest punktem wejścia.","detail":null,"kind":"code"},{"label":"Przebuduj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Makro powinno zmieniać styl wyłącznie tekstu przekazanego w argumencie."},{"name":"Listy i wzory","heading":"Listy oraz równania","intro":"Pakiety <code>enumitem</code> i <code>amsmath</code> dodaj w preambule.","items":[{"label":"Dodaj pakiet enumitem.","code":"\\usepackage{enumitem}","detail":null,"kind":"code"},{"label":"Globalnie ustaw znak wypunktowania i odstępy.","code":"\\setlist[itemize]{label=---,noitemsep,topsep=0pt}","detail":null,"kind":"code"},{"label":"W sekcji Środowiska dodaj listę o własnym symbolu.","code":"\\begin{itemize}[label=*,leftmargin=2.25\\parindent]","detail":null,"kind":"code"},{"label":"Wstaw jeden element nowej listy.","code":"\\item Pozycja lokalnej listy","detail":null,"kind":"code"},{"label":"Zakończ listę.","code":"\\end{itemize}","detail":null,"kind":"code"},{"label":"Dodaj pakiet amsmath.","code":"\\usepackage{amsmath}","detail":null,"kind":"code"},{"label":"W sekcji Wzory zdefiniuj układ równań.","code":"\\begin{equation}\\label{eq:uklad}\\begin{aligned} y &= 2x-2 \\\\ x &= -3y+2 \\end{aligned}\\end{equation}","detail":null,"kind":"code"},{"label":"Dodaj odwołanie do wzoru.","code":"Zobacz równanie \\eqref{eq:uklad}.","detail":null,"kind":"code"},{"label":"Sprawdź wynik kompilacji.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Ustawienia listy podane w nawiasach kwadratowych obowiązują lokalnie. <code>\\eqref</code> dodaje nawiasy automatycznie."},{"name":"Kolory i kod","heading":"Kolory, listingi C i metadane","intro":"Zmiany preambuły wykonaj przed wstawieniem tekstu do dokumentu.","items":[{"label":"Włącz kolory.","code":"\\usepackage{xcolor}","detail":null,"kind":"code"},{"label":"Zdefiniuj kolor wydziałowy.","code":"\\definecolor{wydzialowy}{RGB}{75,160,165}","detail":null,"kind":"code"},{"label":"Wstaw kolorowany tekst.","code":"\\textcolor{wydzialowy}{Przykład tekstu wydziałowego.}","detail":null,"kind":"code"},{"label":"Włącz obsługę listingów UTF-8.","code":"\\usepackage[final]{listingsutf8}","detail":null,"kind":"code"},{"label":"Skonfiguruj podstawowe opcje listingów.","code":"\\lstset{language={[ANSI]C},numbers=left,stepnumber=1,basicstyle=\\ttfamily\\small,frame=single,showspaces=false,showtabs=false,showstringspaces=false,keywordstyle=\\color{blue},stringstyle=\\color{olive},commentstyle=\\color{green}}","detail":null,"kind":"code"},{"label":"W sekcji Listingi dołącz zawartość pliku zrodlo.c.","code":"\\lstinputlisting[language={[ANSI]C},inputencoding=utf8/cp1250]{zrodlo.c}","detail":"Plik źródłowy zrodlo.c powinien być zapisany w UTF-8.","kind":"code"},{"label":"W pliku zrodlo.c zastąp tekst Hello world tekstem Witaj świecie.","code":null,"detail":"Zapisz plik w kodowaniu UTF-8, a następnie ponownie skompiluj dokument.","kind":"text"},{"label":"Dodaj pakiet do załączników.","code":"\\usepackage{embedfile}","detail":null,"kind":"code"},{"label":"Dodaj pakiet hyperref na końcu preambuły.","code":"\\usepackage{hyperref}","detail":null,"kind":"code"},{"label":"Ustaw metadane PDF.","code":"\\hypersetup{pdftitle={Ćwiczenie 5},pdfauthor={Student},pdfsubject={Pakiety i makra},pdfkeywords={LaTeX,makra}}","detail":null,"kind":"code"},{"label":"Za listingiem dołącz jego źródło.","code":"\\embedfile{zrodlo.c}","detail":null,"kind":"code"},{"label":"Zbuduj dokument.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"}],"tail":"Możliwość wyodrębnienia załącznika zależy od używanego czytnika PDF."},{"name":"Bibliografia","heading":"Bibliografia BibTeX","intro":"Użyj pliku <code>zbior.bib</code> z pakietu startowego. Nie usuwaj etykiet i kluczy cytowań.","items":[{"label":"W treści rozdziału Bibliografia dodaj cytowanie.","code":"Przykładowa publikacja \\cite{Przyklad}.","detail":null,"kind":"code"},{"label":"Przed końcem dokumentu dodaj styl cytowania.","code":"\\bibliographystyle{plain}","detail":null,"kind":"code"},{"label":"W następnym wierszu wskaż plik bibliograficzny.","code":"\\bibliography{zbior}","detail":null,"kind":"code"},{"label":"Pierwszy przebieg LaTeX.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Wygeneruj bibliografię.","code":"bibtex wprowadzenie","detail":null,"kind":"code"},{"label":"Powtórz LaTeX, aby ustalić odwołania.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Wykonaj ostatnią kompilację, aby zaktualizować odwołania.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Dodaj własny wpis w zbior.bib.","code":null,"detail":"Zastosuj unikalny klucz i właściwe pola, np. author, title, year. Zacytuj nowy wpis.","kind":"text"},{"label":"Zmień styl na alpha, po czym ponów kompilację BibTeX.","code":"\\bibliographystyle{alpha}","detail":null,"kind":"code"}],"tail":"Po zmianie stylu bibliografii wykonaj ponownie sekwencję LaTeX → BibTeX → LaTeX → LaTeX."},{"name":"Dodatkowe","heading":"Zadania dodatkowe","intro":"Zadania rozszerzone wykonaj przed zakończeniem ćwiczenia.","items":[{"label":"W preambule dodaj pakiet circuitikz.","code":"\\usepackage[smartlabels,european]{circuitikz}","detail":null,"kind":"code"},{"label":"Zacznij środowisko rysunku.","code":"\\begin{figure}[htbp]","detail":null,"kind":"code"},{"label":"Wycentruj schemat.","code":"\\centering","detail":null,"kind":"code"},{"label":"Rozpocznij circuitikz.","code":"\\begin{circuitikz}","detail":null,"kind":"code"},{"label":"Dodaj szeregowy obwód ze źródłem, rezystorem i diodą.","code":"\\draw (0,0) to[battery,l=$V_s$] (0,2) to[R,l=$R_1$] (3,2) to[D,l=$D_1$] (3,0) -- (0,0);","detail":null,"kind":"code"},{"label":"Zakończ circuitikz.","code":"\\end{circuitikz}","detail":null,"kind":"code"},{"label":"Podpisz rysunek.","code":"\\caption{Przykładowy obwód elektroniczny}","detail":null,"kind":"code"},{"label":"Zakończ rysunek.","code":"\\end{figure}","detail":null,"kind":"code"},{"label":"Rozszerz własny schemat o diodę D2 i kondensator C2.","code":null,"detail":"Zwróć uwagę na polaryzację diody i ciągłość połączeń.","kind":"text"},{"label":"Utwórz graf według wzorca od prowadzącego.","code":null,"detail":"Zbuduj go w TikZ lub circuitikz i skompiluj PDF.","kind":"text"}],"tail":"Po zakończeniu zachowaj wynik PDF, pliki źródłowe oraz bazę bibliograficzną."},{"name":"Zakończenie","heading":"Zakończ ćwiczenie","intro":"Zachowaj wynik PDF i komplet źródeł LaTeX. Zweryfikuj ostatnią kompilację.","items":[{"label":"Wykonaj ostatnią kompilację.","code":"pdflatex -interaction=nonstopmode -halt-on-error wprowadzenie.tex","detail":null,"kind":"code"},{"label":"Sprawdź wynikowy plik PDF.","code":null,"detail":"Otwórz wprowadzenie.pdf, przejrzyj podpisy, listy, listing kodu oraz bibliografię.","kind":"text"},{"label":"Zarchiwizuj swoją pracę.","code":null,"detail":"Zachowaj pliki .tex, .c, .bib i PDF. Wspólne stanowisko pozostaw bez swoich danych.","kind":"text"}],"tail":null}],"questions":[{"q":"Ustawiono \\captionsetup[figure]{name=Rys.,labelsep=period}. Jak będzie wyglądał początek podpisu rysunku o numerze 1.1?","a":["Figure 1.1:","Rysunek 1.1.","Rys. 1.1:","Rys. 1.1."],"ok":3,"why":"name ustawia nazwę Rys., a labelsep=period dodaje kropkę jako separator po numerze."},{"q":"Zdefiniowano \\newcommand{\\kod}[1]{\\texttt{#1}}. Co uzyskasz po wpisaniu \\kod{main} w zwykłym akapicie?","a":["Słowo main zapisane pogrubieniem.","Słowo main krojem maszynowym.","Dosłownie tekst #1.","Słowo main zapisane kursywą."],"ok":1,"why":"Makro wstawia argument #1 do polecenia \\texttt, które wybiera krój maszynowy."},{"q":"W rozdziale 2 ustawiono \\renewcommand{\\theequation}{\\arabic{chapter}.\\arabic{equation}}. Jaką etykietę numeracyjną otrzyma trzecie równanie rozdziału?","a":["2.3","3.2","2.3.","3"],"ok":0,"why":"Format numeracji to numer rozdziału, kropka i kolejny numer równania w danym rozdziale."},{"q":"Globalnie ustawiono \\setlist[itemize]{label=---}, ale konkretna lista zaczyna się od \\begin{itemize}[label=*]. Jaki znacznik zostanie zastosowany w tej liście?","a":["Trzy kreski z ustawienia globalnego.","Kolejny numer arabski.","Gwiazdka z opcji lokalnej.","Brak widocznego znacznika."],"ok":2,"why":"Opcja lokalna label=* nadpisuje globalną konfigurację znacznika dla tej listy."},{"q":"W środowisku aligned użyto wierszy y &= 2x-2 oraz x &= -3y+2. Który element obu wierszy będzie wyrównany?","a":["Początek pierwszej litery w równaniach.","Znak minus przy wyrazie stałym.","Prawy koniec całego wiersza.","Znaki równości następujące po &."],"ok":3,"why":"Znacznik & wyznacza punkt wyrównania; w tych wierszach umieszczono go przed =."},{"q":"Chcesz, aby zrodlo.c było widoczne jako listing w PDF i jednocześnie dołączone jako plik możliwy do wyodrębnienia. Jaki zestaw poleceń spełnia oba cele?","a":["\\input{zrodlo.c} i \\cite{zrodlo.c}","\\lstset{zrodlo.c} i \\bibliography{zrodlo.c}","\\lstinputlisting{zrodlo.c} i \\embedfile{zrodlo.c}","\\embedfile{zrodlo.c} i \\label{zrodlo.c}"],"ok":2,"why":"\\lstinputlisting drukuje zawartość kodu, a \\embedfile osadza rzeczywisty plik jako załącznik PDF."},{"q":"Po wykonaniu \\hypersetup{pdfauthor={Student},pdftitle={Ćwiczenie 5}} gdzie należy oczekiwać tych informacji?","a":["W nagłówku każdej strony dokumentu.","W metadanych dokumentu PDF.","W spisie treści generowanym z sekcji.","W podpisie każdego listingu kodu."],"ok":1,"why":"pdfauthor i pdftitle ustawiają metadane PDF; nie tworzą automatycznie widocznej strony tytułowej."},{"q":"Po dodaniu nowego wpisu do zbior.bib i cytowania \\cite{NowyKlucz} chcesz zaktualizować bibliografię BibTeX. Jaka sekwencja jest właściwa?","a":["PDFLaTeX → BibTeX → PDFLaTeX → PDFLaTeX","BibTeX → PDFLaTeX → PDFLaTeX → BibTeX","PDFLaTeX → PDFLaTeX → BibTeX → koniec","PDFLaTeX → BibTeX → koniec"],"ok":0,"why":"Pierwszy przebieg tworzy .aux, BibTeX generuje bibliografię, a kolejne przebiegi rozwiązują cytowania."},{"q":"Numer równania ma postać 2.3. Co zwróci \\eqref{eq:uklad} w tekście przy poprawnie ustawionej etykiecie?","a":["eq:uklad","Równanie 2.3","2.3","(2.3)"],"ok":3,"why":"\\eqref z pakietu amsmath otacza numer równania nawiasami."},{"q":"W circuitikz zapisano \\draw (0,0) to[battery] (0,2) to[R] (3,2) to[D] (3,0) -- (0,0);. Na którym odcinku umieszczono rezystor?","a":["Między (0,0) i (0,2).","Między (3,2) i (3,0).","Między (0,2) i (3,2).","Między (3,0) i (0,0)."],"ok":2,"why":"Kolejny element to[R] należy do odcinka od (0,2) do (3,2); bateria jest z lewej, a dioda z prawej."}],"starter":{"wprowadzenie.tex":"\\documentclass[11pt,a4paper]{report}\n\\usepackage[T1]{fontenc}\n\\usepackage[utf8]{inputenc}\n\\usepackage[polish]{babel}\n\\usepackage{lmodern}\n\\usepackage{graphicx}\n\\title{Pakiety i makra LaTeX}\n\\author{Student}\n\\date{\\today}\n\\begin{document}\n\\maketitle\n\\tableofcontents\n\\listoffigures\n\\chapter{Podstawy}\n\\section{Środowiska}\n\\begin{itemize}\n  \\item Pierwszy element\n  \\item Drugi element\n\\end{itemize}\n\\subsection{Przykład podsekcji}\n\\begin{figure}[htbp]\n  \\centering\n  \\fbox{\\Large\\LaTeX}\n  \\caption{Logo projektu LaTeX}\n\\end{figure}\n\\begin{table}[htbp]\n  \\caption{Przykładowa tabela}\n  \\centering\n  \\begin{tabular}{|l|r|}\\hline\n    A & 1\\\\ \\hline\n    B & 2\\\\ \\hline\n  \\end{tabular}\n\\end{table}\n\\chapter{Zastosowania}\n\\section{Listingi}\nW tym miejscu dodasz listing pliku C.\n\\section{Wzory}\n\\begin{equation}\\label{eq:wzor}\n  x = 1\n\\end{equation}\n\\chapter{Bibliografia}\nW tym miejscu dodasz cytowania.\n\\end{document}\n","zrodlo.c":"#include <stdio.h>\nint main(void) {\n    puts(\"Hello world\");\n    return 0;\n}\n","zbior.bib":"@book{Przyklad,\n  author = {Nowak, Jan},\n  title = {Przykładowa publikacja do ćwiczenia},\n  year = {2020},\n  publisher = {Wydawnictwo przykładowe}\n}\n","fragmenty.tex":"% Pomocniczy plik z przykładami poleceń do ćwiczenia 5.\n% Przenieś potrzebne fragmenty do wprowadzenie.tex.\n% \\usepackage{caption}\n% \\usepackage{enumitem}\n% \\usepackage{amsmath}\n% \\usepackage{xcolor}\n% \\usepackage{listingsutf8}\n% \\usepackage{hyperref}\n% \\usepackage{embedfile}\n"}};
const STEPS=CONFIG.steps;
const QUESTIONS=CONFIG.questions;
const STARTER=CONFIG.starter||{};
let current=0,completed=false,report=null;
const quizAnswers=Array(QUESTIONS.length).fill(null);
let quizAlbum='';
const $=id=>document.getElementById(id);
function esc(value){return String(value).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function commandSteps(items){
 return '<ol class="task-list">'+items.map(({label,code,detail,kind})=>
  '<li class="task '+(code?'':'text-only')+'"><div class="task-label">'+esc(label)+'</div>'+
  (code?'<pre><code>'+esc(code)+'</code></pre>':'<div class="details">'+(kind==='starter'?'<div class="starter-files" id="starterFiles"></div>':'')+'</div>')+
  (detail?'<div class="detail">'+esc(detail)+'</div>':'')+'</li>').join('')+'</ol>';
}
function btn(label,variant,fn){const x=document.createElement('button');x.type='button';x.className='btn '+variant;x.textContent=label;x.addEventListener('click',fn);return x;}
function downloadFile(filename,contents,mime){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.download=filename;a.href=url;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function show(n){
 if(completed && n!==STEPS.length+1)return;
 if(n<0||n>STEPS.length+1 || (n===STEPS.length+1&&!completed))return;
 current=n;
 const all=STEPS.map(s=>s.name).concat(['Test','Wyniki']);
 $('nav').replaceChildren();all.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className=i===n?'active':'';b.disabled=(completed&&i!==n)||(!completed&&i===STEPS.length+1);b.innerHTML='<span>'+String(i+1)+'</span>'+esc(name);b.setAttribute('aria-current',i===n?'step':'false');b.addEventListener('click',()=>show(i));$('nav').append(b);});
 $('progress').innerHTML=all.map((_,i)=>'<i class="'+(i<=n?'current':'')+'"></i>').join('');
 const c=$('content');
 if(n<STEPS.length){const s=STEPS[n];c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>'+esc(s.heading)+'</h2><p>'+s.intro+'</p>'+commandSteps(s.items)+(s.tail?'<div class="hint">'+s.tail+'</div>':'');
  const holder=$('starterFiles');if(holder){Object.entries(STARTER).forEach(([filename,contents])=>{const b=document.createElement('button');b.type='button';b.textContent=filename;b.addEventListener('click',()=>downloadFile(filename,contents,'text/plain;charset=utf-8'));holder.append(b);});}
 }else if(n===STEPS.length){c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Sprawdź wiedzę</h2><p>10 pytań, po cztery odpowiedzi. Wybierz po jednej. Wyniki zostaną pokazane po zakończeniu.</p><p class="album"><label for="album">Numer albumu (opcjonalnie): </label><input id="album" type="text" inputmode="numeric" maxlength="12" autocomplete="off"></p><form id="quiz" novalidate></form>';drawQuiz();$('album').value=quizAlbum;$('album').addEventListener('input',e=>quizAlbum=e.target.value);
 }else{c.innerHTML='<div class="step-count">Etap '+(n+1)+' / '+all.length+'</div><h2>Wynik podejścia</h2><div id="results"></div>';drawResults();}
 const a=$('actions');a.replaceChildren();if(n>0&&!completed)a.append(btn('Poprzedni','',()=>show(n-1)));
 if(n<STEPS.length)a.append(btn('Następny','primary',()=>show(n+1)));
 else if(n===STEPS.length&&!completed)a.append(btn('Zakończ i oceń','teal',grade));
 else if(n===STEPS.length+1)a.append(btn('Zapisz wynik JSON','primary',saveReport));
 window.scrollTo(0,0);
}
function drawQuiz(){const form=$('quiz');QUESTIONS.forEach((q,i)=>{
 const field=document.createElement('fieldset');field.className='question';const legend=document.createElement('legend');legend.innerHTML=String(i+1)+'. '+q.q;field.append(legend);
 const choices=document.createElement('div');choices.className='answer';q.a.forEach((answer,k)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=String(k);radio.autocomplete='off';radio.checked=quizAnswers[i]===k;radio.addEventListener('change',()=>quizAnswers[i]=k);label.append(radio,document.createTextNode(answer));choices.append(label);});field.append(choices);form.append(field);});}
function grade(){if(completed)return;
 const vals=quizAnswers.slice();
 const missing=vals.filter(x=>x===null).length;if(missing){alert('Odpowiedz na wszystkie pytania. Brak: '+missing+'.');return;}
 const album=$('album').value.trim();if(album&&!/^\d{1,12}$/.test(album)){alert('Numer albumu musi zawierać od 1 do 12 cyfr.');return;}
 const score=vals.reduce((n,a,i)=>n+Number(a===QUESTIONS[i].ok),0);
 report={schema:'ndp-lab-assessment/1.0',exercise:CONFIG.id,finished_at:new Date().toISOString(),album:album||null,score,max_score:10,percent:score*10,answers:vals.map((answer,i)=>({number:i+1,answer_index:answer,correct:answer===QUESTIONS[i].ok}))};
 completed=true;show(STEPS.length+1);
}
function drawResults(){if(!report)return;const r=$('results');r.innerHTML='<div class="kpis"><div class="kpi">Punkty<strong>'+report.score+' / 10</strong></div><div class="kpi">Wynik<strong>'+report.percent+'%</strong></div></div><p class="details">Poniżej podano ocenę odpowiedzi i poprawne rozwiązania</p>';
 QUESTIONS.forEach((q,i)=>{const isCorrect=report.answers[i].correct;const b=document.createElement('div');b.className='result-item '+(isCorrect?'good':'');
 const h=document.createElement('strong');h.textContent=(i+1)+'. '+(isCorrect?'Poprawnie':'Błąd')+' · '+q.q.replace(/<[^>]*>/g,'');b.append(h);
 const v=document.createElement('p');v.textContent='Twoja odpowiedź: '+q.a[report.answers[i].answer_index];b.append(v);
 if(!isCorrect){const c=document.createElement('p');c.textContent='Poprawna odpowiedź: '+q.a[q.ok];b.append(c);}
 const why=document.createElement('p');why.className='details';why.textContent=q.why;b.append(why);r.append(b);});
}
function saveReport(){if(!report)return;downloadFile('ndp_lab_'+CONFIG.number+'_wynik_'+(report.album||'anonim')+'.json',JSON.stringify(report,null,2)+'\n','application/json;charset=utf-8');}
show(0);
</script>
</body>
</html>
