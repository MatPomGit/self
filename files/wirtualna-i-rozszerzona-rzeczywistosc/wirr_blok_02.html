<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiRR • Blok 02 • Laboratoria 03–04</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#163047;background:#edf3f7;line-height:1.48}
*{box-sizing:border-box}body{margin:0}header{background:#003c82;color:white;padding:13px max(18px,calc((100vw - 1120px)/2))}
header h1{font-size:1.25rem;margin:0}header p{margin:3px 0;color:#e0efff;font-size:.86rem}
.layout{max-width:1120px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px}
aside,main{background:white;border:1px solid #d7e3ed;border-radius:13px}aside{padding:13px;height:max-content;position:sticky;top:12px}
aside h2{font-size:1rem;margin:0 0 12px}nav button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px 12px;color:#254866;border-radius:8px;cursor:pointer;font-size:.94rem}
nav button[aria-current=page]{background:#e4effa;color:#003c82;font-weight:700}
main{padding:20px 24px;min-height:420px}h2{font-size:1.23rem;margin:0 0 8px}h3{font-size:1.05rem;margin:12px 0 8px}
.lead{color:#486176;font-size:.95rem;margin:6px 0 13px}.task{padding:10px 0;border-bottom:1px solid #e4edf3;display:grid;grid-template-columns:28px minmax(0,1fr);gap:7px}
.task:last-child{border-bottom:0}.num{color:#087e8b;font-weight:750}.task p{margin:0}
.task .body{font-size:.96rem}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}
button.primary{background:#003c82;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.secondary{background:white;color:#003c82;border:1px solid #adc4d9;border-radius:8px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.chip{display:inline-block;border:1px solid #c4d9e7;border-radius:12px;padding:1px 8px;font-size:.76rem;color:#35536a}
fieldset{margin:0 0 10px;padding:12px;border:1px solid #d8e5ed;border-radius:9px}legend{font-weight:650;padding:0 5px}
.option{display:block;border:1px solid #e0e8ef;padding:7px 9px;margin:5px 0;border-radius:6px;cursor:pointer}.option:has(input:checked){border-color:#087e8b;background:#ecfaf8}
input{accent-color:#087e8b}input[type=text]{padding:8px;border:1px solid #b8cbd9;border-radius:7px;max-width:270px;width:100%}
.result{padding:9px 12px;margin:9px 0;border-left:4px solid #b9c8d4;background:#f5f8fb}
.result.bad{border-color:#b94a49}.result.good{border-color:#087e8b}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#133d5a}
footer{padding:9px 0;color:#61788a;font-size:.8rem}
@media(max-width:690px){.layout{display:block}aside{position:static;margin-bottom:12px}nav{display:flex;flex-wrap:wrap;gap:3px}nav button{width:auto;padding:7px 9px}main{padding:16px}header{padding:12px 16px}}
@media print{aside,.controls,button{display:none!important}.layout{display:block}main{border:0}}
</style></head>
<body><header><h1>WiRR · Blok 02 · Laboratoria 03 i 04</h1>
<p>Politechnika Rzeszowska · Wirtualna i rozszerzona rzeczywistość</p></header>
<div class="layout"><aside><h2>Przebieg bloku</h2><nav id="navigation" aria-label="Nawigacja"></nav>
<footer>Każde laboratorium ma osobny wynik. Zapis raportu jest dobrowolny.</footer></aside>
<main id="content"></main></div>
<script>const DATA={"block":"02","labs":[{"n":"03","title":"Kotwica to nie gwarancja stałości","mode":"SIM_AR","steps":[["Uruchom galerię kotwic","Otwórz Lab 03 w Unity i włącz Play → Game w trybie SIM_AR."],["Ustal punkt odniesienia","Znajdź referencję 0,30 m i umieść model w skali 1:1. Odczytaj błąd w cm."],["Zmierz warunek A","Wybierz powierzchnię o wielu cechach; zapisz 3 odczyty błędu."],["Zmierz warunek B","Powtórz 3 odczyty przy powierzchni ubogiej w cechy, zachowując tor kamery i model."],["Zinterpretuj rozrzut","Rozróżnij średnie przesunięcie od zmienności położenia modelu."],["Sprawdź odzyskanie śledzenia","Wywołaj kontrolowaną utratę śledzenia, wznów je i zapisz czas oraz błąd po odzyskaniu."]],"questions":[{"q":"Kotwica AR: które stwierdzenie jest poprawne?","opts":["Zawsze zapewnia dokładność 1 mm","Nie wymaga śledzenia","Nie gwarantuje zerowego błędu pozycjonowania","Jest miarą FPS"],"ans":2,"why":"Nie gwarantuje zerowego błędu pozycjonowania"},{"q":"30 cm: które stwierdzenie jest poprawne?","opts":["To 0,30 m","To 3 m","To 300 m","To 0,03 mm"],"ans":0,"why":"To 0,30 m"},{"q":"Rozrzut pomiarów: które stwierdzenie jest poprawne?","opts":["Zawsze oznacza błąd GPU","Opisuje zmienność odczytów","Jest tożsamy ze stałym przesunięciem","Jest liczbą pikseli"],"ans":1,"why":"Opisuje zmienność odczytów"},{"q":"Relokalizacja: które stwierdzenie jest poprawne?","opts":["Może zmienić położenie modelu po odzyskaniu śledzenia","Oznacza kompilację","Wyłącza wszystkie czujniki","Zawsze zachowuje pozycję bez błędu"],"ans":0,"why":"Może zmienić położenie modelu po odzyskaniu śledzenia"},{"q":"SIM_AR: które stwierdzenie jest poprawne?","opts":["Zawsze działa w ROS_LIVE","Wymaga Quest 3","Dowodzi dokładności ARCore na urządzeniu","Nie jest pomiarem rzeczywistego telefonu"],"ans":3,"why":"Nie jest pomiarem rzeczywistego telefonu"},{"q":"Jak traktować nieudaną próbę?","opts":["Wpisać wynik 0 s","Usunąć z raportu","Zastąpić średnią","Zachować jako nieudaną"],"ans":3,"why":"Zachować jako nieudaną"},{"q":"Co oznacza brak odczytu?","opts":["Zawsze błąd studenta","Wynik zerowy","Dowód poprawnego działania","Brak danych, nie wartość zero"],"ans":3,"why":"Brak danych, nie wartość zero"},{"q":"Co należy porównać przy modyfikacji ustawienia?","opts":["Tylko najlepszy pomiar","Tylko poprawiony wariant","Dwie różne sceny","Wynik przed i po zmianie"],"ans":3,"why":"Wynik przed i po zmianie"},{"q":"Jak ograniczyć wpływ czynników zakłócających?","opts":["Pominąć warunki testu","Zmienić jednocześnie wszystkie parametry","Zmieniać trasę kamery w każdej próbie","Utrzymywać pozostałe parametry stałe"],"ans":3,"why":"Utrzymywać pozostałe parametry stałe"},{"q":"Co stanowi podstawę interpretacji?","opts":["Przewidywane wyniki","Wyłącznie liczba klatek","Własne, zapisane obserwacje","Przykładowe dane zastępcze"],"ans":2,"why":"Własne, zapisane obserwacje"}]},{"n":"03","title":"Za ścianą rzeczywistość też obowiązuje","mode":"SIM_AR","steps":[["Otwórz scenę","Włącz Lab 04 w trybie SIM_AR; wybierz pierwszą przygotowaną pozycję kamery."],["Rozpoznaj błąd","Sprawdź widoczność modelu, etykietę i wynik promienia przed poprawą okluzji."],["Porównaj okluzję","Przełącz między niepoprawną a poprawną okluzją w tej samej scenie i widoku."],["Policz błędy","Zanotuj poprawne wskazania, błędy widoczności oraz fałszywe alarmy."],["Skoryguj głębię","Zmieniaj wyłącznie przygotowany parametr głębi, bez zmiany oświetlenia."],["Sprawdź drugi widok","Przenieś kamerę w drugie oznaczone miejsce i zweryfikuj poprawność okluzji."]],"questions":[{"q":"Okluzja: które stwierdzenie jest poprawne?","opts":["Sposób zapisu sceny","Zawsze pokazanie wszystkiego","Poprawne zasłanianie dalszych obiektów przez bliższe","Zwiększanie liczby klatek"],"ans":2,"why":"Poprawne zasłanianie dalszych obiektów przez bliższe"},{"q":"Raycast: które stwierdzenie jest poprawne?","opts":["Nie gwarantuje poprawnego zasłaniania obrazu","Automatycznie ustawia przezroczystość","Zastępuje bufor głębi","Zawsze eliminuje fałszywe alarmy"],"ans":0,"why":"Nie gwarantuje poprawnego zasłaniania obrazu"},{"q":"Porównanie A/B: które stwierdzenie jest poprawne?","opts":["Nie wymaga danych","Wymaga tego samego położenia kamery","Wymaga zmiany światła i geometrii naraz","Zawsze wykonuje się w Scene"],"ans":1,"why":"Wymaga tego samego położenia kamery"},{"q":"Fałszywy alarm: które stwierdzenie jest poprawne?","opts":["Dodatkowa klatka renderingu","Zmiana wersji Unity","Niepoprawne zgłoszenie obecności zagrożenia lub przeszkody","Prawidłowe zasłonięcie"],"ans":2,"why":"Niepoprawne zgłoszenie obecności zagrożenia lub przeszkody"},{"q":"Drugi punkt obserwacji: które stwierdzenie jest poprawne?","opts":["Sprawdza uogólnienie poprawki","Zawsze zapewnia identyczne wyniki","Jest testem czasu sieci","Nie wymaga kontroli geometrii"],"ans":0,"why":"Sprawdza uogólnienie poprawki"},{"q":"Jak traktować nieudaną próbę?","opts":["Zastąpić średnią","Zachować jako nieudaną","Usunąć z raportu","Wpisać wynik 0 s"],"ans":1,"why":"Zachować jako nieudaną"},{"q":"Co oznacza brak odczytu?","opts":["Zawsze błąd studenta","Brak danych, nie wartość zero","Wynik zerowy","Dowód poprawnego działania"],"ans":1,"why":"Brak danych, nie wartość zero"},{"q":"Co należy porównać przy modyfikacji ustawienia?","opts":["Tylko najlepszy pomiar","Tylko poprawiony wariant","Wynik przed i po zmianie","Dwie różne sceny"],"ans":2,"why":"Wynik przed i po zmianie"},{"q":"Jak ograniczyć wpływ czynników zakłócających?","opts":["Pominąć warunki testu","Utrzymywać pozostałe parametry stałe","Zmienić jednocześnie wszystkie parametry","Zmieniać trasę kamery w każdej próbie"],"ans":1,"why":"Utrzymywać pozostałe parametry stałe"},{"q":"Co stanowi podstawę interpretacji?","opts":["Przykładowe dane zastępcze","Własne, zapisane obserwacje","Wyłącznie liczba klatek","Przewidywane wyniki"],"ans":1,"why":"Własne, zapisane obserwacje"}]}]};
const labs=DATA.labs;
const pages=labs.flatMap((l,i)=>[{kind:"lab",i},{kind:"quiz",i}]).concat([{kind:"results"}]);
const entries=[labs[0].n+" • Instrukcja",labs[0].n+" • Test",labs[1].n+" • Instrukcja",labs[1].n+" • Test","Wyniki"];
const answers=labs.map(l=>Array(l.questions.length).fill(null));
const done=[false,false],results=[null,null];
let current=0;
const main=document.getElementById("content");
const nav=document.getElementById("navigation");
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(){
 nav.replaceChildren();
 entries.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s;b.type="button";if(i===current)b.setAttribute("aria-current","page");b.disabled=i===4&&!done.every(Boolean);
 b.onclick=()=>{current=i;draw()};nav.append(b)});
 const page=pages[current];
 if(page.kind==="lab"){
  const l=labs[page.i];
  main.innerHTML=`<h2>Laboratorium ${l.n}: ${escapeHtml(l.title)}</h2><p class="lead"><span class="chip">${escapeHtml(l.mode)}</span> Wykonaj etapy w przygotowanej scenie Unity. Ocena merytoryczna doświadczenia należy do prowadzącego.</p><div id="steps"></div><div class="controls"><button class="secondary" id="prev">Poprzednia sekcja</button><button class="primary" id="next">Przejdź do testu</button></div>`;
  const holder=document.getElementById("steps");
  l.steps.forEach((s,i)=>{const d=document.createElement("div");d.className="task";const a=document.createElement("div");a.className="num";a.textContent=i+1+".";const b=document.createElement("div");b.className="body";const title=document.createElement("strong");title.textContent=s[0];const p=document.createElement("p");p.textContent=s[1];b.append(title,p);d.append(a,b);holder.append(d)});
  document.getElementById("prev").disabled=current===0;
  document.getElementById("prev").onclick=()=>{current=Math.max(0,current-1);draw()};
  document.getElementById("next").onclick=()=>{current++;draw()};
 }else if(page.kind==="quiz"){
  const l=labs[page.i];
  main.innerHTML=`<h2>Laboratorium ${l.n}: Test końcowy</h2><p class="lead">10 pytań, 4 odpowiedzi. Jedna poprawna. Wynik pojawia się po oddaniu całego testu.</p><form id="questions"></form><div class="controls"><button class="secondary" type="button" id="prev">Wróć do instrukcji</button><button class="primary" type="button" id="submit">Zakończ test</button></div><p id="notice" role="status"></p>`;
  const f=document.getElementById("questions");
  l.questions.forEach((q,qi)=>{const field=document.createElement("fieldset"),leg=document.createElement("legend");leg.textContent=(qi+1)+". "+q.q;field.append(leg);
    q.opts.forEach((o,oi)=>{const label=document.createElement("label");label.className="option";const input=document.createElement("input");input.type="radio";input.name="q"+qi;input.value=oi;input.checked=answers[page.i][qi]===oi;input.disabled=done[page.i];input.addEventListener("change",()=>{answers[page.i][qi]=oi});label.append(input,document.createTextNode(" "+o));field.append(label)});f.append(field)});
  document.getElementById("prev").onclick=()=>{current--;draw()};
  const submit=document.getElementById("submit");submit.disabled=done[page.i];submit.textContent=done[page.i]?"Test zakończony":"Zakończ test";
  submit.onclick=()=>{
    if(done[page.i])return;
    if(answers[page.i].some(x=>x===null)){document.getElementById("notice").textContent="Odpowiedz na wszystkie 10 pytań.";return}
    const score=l.questions.reduce((s,q,i)=>s+(answers[page.i][i]===q.ans?1:0),0);
    results[page.i]={lab:l.n,score,max:10,answers:l.questions.map((q,i)=>({question:q.q,chosen:q.opts[answers[page.i][i]],correct:q.opts[q.ans],ok:answers[page.i][i]===q.ans}))};
    done[page.i]=true;current=done.every(Boolean)?4:(page.i===0?2:4);draw();
  };
 }else{
  main.innerHTML='<h2>Wyniki obu laboratoriów</h2><p class="lead">Wynik testów wiedzy jest niezależny od oceny wykonania eksperymentów w Unity.</p><div id="scores"></div><button class="primary" id="export">Zapisz raport JSON</button>';
  const el=document.getElementById("scores");
  results.forEach((r,j)=>{if(!r)return;const h=document.createElement("h3");h.textContent="Laboratorium "+r.lab+": "+r.score+"/10 ("+r.score*10+"%)";el.append(h);
    r.answers.forEach((a,i)=>{const d=document.createElement("div");d.className="result "+(a.ok?"good":"bad");d.textContent=(i+1)+". "+a.question+" — "+(a.ok?"Poprawnie":"Błędnie")+". Poprawna odpowiedź: "+a.correct;el.append(d)})});
  document.getElementById("export").onclick=()=>{const report={schema:"wirr-block-assessment/1.0",block:DATA.block,results,created_at:new Date().toISOString(),note:"Lokalny test wiedzy, bez automatycznej oceny działania scen Unity"};const blob=new Blob([JSON.stringify(report,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="wirr_blok_"+DATA.block+"_wyniki.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 }
}
draw();
</script></body></html>
