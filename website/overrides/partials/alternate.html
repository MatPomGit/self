{# Preserve the current page when changing language, including without JavaScript. #}
<div class="md-header__option">
  <div class="md-select">
    <button class="md-header__button md-icon" aria-label="{{ lang.t('select.language') }}">
      {% include ".icons/material/translate.svg" %}
    </button>
    <div class="md-select__inner">
      <ul class="md-select__list">
        {% for alt in config.extra.alternate %}
          <li class="md-select__item">
            <a href="{{ alt.link }}{{ page.url if page else '' }}" hreflang="{{ alt.lang }}" class="md-select__link"{% if alt.lang == config.theme.language %} aria-current="true"{% endif %}>{{ alt.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
